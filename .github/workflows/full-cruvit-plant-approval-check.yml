name: Full CRUVIT Plant Approval Gate Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-cruvit-plant-approval-check.yml'
      - 'modules/catalog/full-cruvit-plant-approval-v1.js'
      - 'tests/full-cruvit-plant-approval-v1.test.mjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/full-cruvit-plant-approval-v1.test.mjs
