name: CRUVIT Batch B Lavender Repair Model QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cruvit-batch-b-lavender-repair-model-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://friendly-taiyaki-64aacb.netlify.app
      RUN_ID: cruvit-e2e-batch-b-lavender-vegetative-model-qa-repair-2026-09-25-v1
      JOB_ID: english-lavender__mature__shrub__vegetative__v1
    steps:
      - name: Run Lavender repair Model QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p execution-results
          curl --fail-with-body --silent --show-error             -X POST "$BASE_URL/.netlify/functions/plant-visual-model-qa-job"             -H 'content-type: application/json'             --data '{"runId":"cruvit-e2e-batch-b-lavender-vegetative-model-qa-repair-2026-09-25-v1","jobId":"english-lavender__mature__shrub__vegetative__v1"}'             | tee execution-results/lavender-repair-model-qa.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cruvit-batch-b-lavender-repair-model-qa
          path: execution-results/
          if-no-files-found: warn
          retention-days: 30
