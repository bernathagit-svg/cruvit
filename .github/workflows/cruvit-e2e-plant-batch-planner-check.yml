name: E2E Plant Batch Planner Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cruvit-e2e-plant-batch-planner-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cruvit-e2e-plant-batch-planner-v1.test.mjs
