      - name: Run full approval authority for all 90 plants
        shell: bash
        run: |
          set -euo pipefail
          jq '{slugs:[.items[].canonicalSlug]}' /tmp/payload.json > /tmp/approval-payload.json
          curl --fail-with-body --silent --show-error             -X POST "https://friendly-taiyaki-64aacb.netlify.app/.netlify/functions/full-cruvit-plant-approval?compact=1"             -H 'content-type: application/json'             --data-binary @/tmp/approval-payload.json             -o /tmp/approval.json
          jq '.' /tmp/approval.json
          jq -e '.ok == true' /tmp/approval.json >/dev/null
          jq -e '.total == 90' /tmp/approval.json >/dev/null

      - name: Build revalidation summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp /tmp/intake.json artifacts/intake.json
          cp /tmp/approval.json artifacts/full-approval.json
          jq -n             --slurpfile intake /tmp/intake.json             --slurpfile approval /tmp/approval.json             '{
              runId:"cruvit-full-catalog-revalidation-90-2026-09-26-v1",
              total:90,
              intake:{
                byStage:$intake[0].byStage,
                counts:$intake[0].counts,
                paidCallsExecuted:$intake[0].paidCallsExecuted,
                catalogWritesExecuted:$intake[0].catalogWritesExecuted,
                productionWritesExecuted:$intake[0].productionWritesExecuted,
                registryWritesExecuted:$intake[0].registryWritesExecuted
              },
              approval:{
                approved:$approval[0].approved,
                blocked:$approval[0].blocked,
                byStatus:$approval[0].byStatus,
                blockerCounts:$approval[0].blockerCounts
              },
              blockedRows:[$approval[0].rows[]|select(.approved!=true)],
              approvedRows:[$approval[0].rows[]|select(.approved==true)]
            }' > artifacts/summary.json
          jq '.' artifacts/summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: cruvit-full-catalog-revalidation-90
          path: artifacts/
          retention-days: 30
