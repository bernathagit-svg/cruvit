name: CRUVIT Full Catalog Revalidation 90

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-catalog-revalidation-90.yml'
      - 'modules/catalog/full-cruvit-plant-approval-v1.js'
      - 'tests/full-cruvit-plant-approval-v1.test.mjs'

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALL_SLUGS: "acerola,apple,apricot,artichoke,asparagus,bay-laurel,bigleaf-hydrangea,blackberry,blackcurrant,blue-gum,blueberry,borage,boxwood,breadfruit,broccoli,cacao,carob,carrot,chestnut,chinese-wisteria,chives,cilantro,clematis,common-jasmine,common-lilac,common-myrtle,common-thyme,cranberry,crepe-myrtle,dill,durian,elderberry,english-lavender,english-walnut,feijoa,fig,flowering-dogwood,forsythia,french-marigold,garden-pea,garden-peony,garden-sage,ginkgo,gooseberry,grapefruit,green-bean,hazelnut,jaboticaba,jujube,lesser-bougainvillea,lettuce,longan,loquat,mangosteen,medlar,nasturtium,okra,oleander,oregano,parsley,peach,pear,pecan,persimmon,pitanga,plum,pomegranate,quince,raspberry,red-currant,rhubarb,sapodilla,sea-buckthorn,serviceberry,silver-birch,soursop,southern-magnolia,spearmint,spinach,strawberry,sweet-cherry,sweet-orange,sweet-potato,tamarind,turmeric,watermelon,white-sapote,yucca,zinnia,zucchini"
    steps:
      - name: Build 90-plant payload
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ALL_SLUGS" | tr ',' '\n' | jq -R -s '
            split("\n")
            | map(select(length>0))
            | {items: map({canonicalSlug:.})}
          ' > /tmp/payload.json
          jq -e '.items|length == 90' /tmp/payload.json >/dev/null
          jq '{slugs:[.items[].canonicalSlug]}' /tmp/payload.json > /tmp/approval-payload.json

      - name: Run live Plant Intake Engine for all 90 plants
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "https://friendly-taiyaki-64aacb.netlify.app/.netlify/functions/cruvit-plant-intake-engine" \
            -H 'content-type: application/json' \
            --data-binary @/tmp/payload.json \
            -o /tmp/intake.json
          jq -e '.ok == true' /tmp/intake.json >/dev/null
          jq -e '.total == 90' /tmp/intake.json >/dev/null
          jq '{ok,total,byStage,counts,paidCallsExecuted,catalogWritesExecuted,productionWritesExecuted,registryWritesExecuted}' /tmp/intake.json

      - name: Run full approval authority for all 90 plants
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "https://friendly-taiyaki-64aacb.netlify.app/.netlify/functions/full-cruvit-plant-approval?compact=1" \
            -H 'content-type: application/json' \
            --data-binary @/tmp/approval-payload.json \
            -o /tmp/approval.json
          jq -e '.ok == true' /tmp/approval.json >/dev/null
          jq -e '.total == 90' /tmp/approval.json >/dev/null
          jq '{ok,total,approved,blocked,byStatus,blockerCounts}' /tmp/approval.json

      - name: Build revalidation summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp /tmp/intake.json artifacts/intake.json
          cp /tmp/approval.json artifacts/full-approval.json
          jq -n \
            --slurpfile intake /tmp/intake.json \
            --slurpfile approval /tmp/approval.json \
            '{
              runId:"cruvit-full-catalog-revalidation-90-2026-09-26-v3-post-reproductive-wave-2",
              total:90,
              intake:{
                byStage:$intake[0].byStage,
                counts:$intake[0].counts,
                paidCallsExecuted:$intake[0].paidCallsExecuted,
                catalogWritesExecuted:$intake[0].catalogWritesExecuted,
                productionWritesExecuted:$intake[0].productionWritesExecuted,
                registryWritesExecuted:$intake[0].registryWritesExecuted
              },
              approval:{
                approved:$approval[0].approved,
                blocked:$approval[0].blocked,
                byStatus:$approval[0].byStatus,
                blockerCounts:$approval[0].blockerCounts
              },
              blockedRows:[$approval[0].rows[]|select(.approved!=true)],
              approvedRows:[$approval[0].rows[]|select(.approved==true)]
            }' > artifacts/summary.json
          jq '.' artifacts/summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: cruvit-full-catalog-revalidation-90
          path: artifacts/
          retention-days: 30
