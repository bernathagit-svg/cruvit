name: Real PI Provider Preflight

on:
  push:
    branches:
      - test/real-pi-provider-preflight-20261013

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      HAS_NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
      HAS_NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN != '' }}
      HAS_NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID != '' }}
    steps:
      - name: Check Netlify secret presence only
        shell: bash
        run: |
          set -euo pipefail
          echo "HAS_NETLIFY_AUTH_TOKEN=$HAS_NETLIFY_AUTH_TOKEN"
          echo "HAS_NETLIFY_TOKEN=$HAS_NETLIFY_TOKEN"
          echo "HAS_NETLIFY_SITE_ID=$HAS_NETLIFY_SITE_ID"
          if [ "$HAS_NETLIFY_AUTH_TOKEN" != "true" ] && [ "$HAS_NETLIFY_TOKEN" != "true" ]; then
            echo "NO_NETLIFY_TOKEN_FOUND"
            exit 2
          fi
          echo "NETLIFY_TOKEN_AVAILABLE"
