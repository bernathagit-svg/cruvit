name: Real PI Provider Preflight

on:
  push:
    branches:
      - test/real-pi-provider-preflight-20261013

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY != '' }}
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY != '' }}
    steps:
      - name: Check secret presence only
        shell: bash
        run: |
          set -euo pipefail
          echo "HAS_ANTHROPIC_KEY=$HAS_ANTHROPIC_KEY"
          echo "HAS_ANTHROPIC_API_KEY=$HAS_ANTHROPIC_API_KEY"
          echo "HAS_CLAUDE_API_KEY=$HAS_CLAUDE_API_KEY"
          if [ "$HAS_ANTHROPIC_KEY" != "true" ] && [ "$HAS_ANTHROPIC_API_KEY" != "true" ] && [ "$HAS_CLAUDE_API_KEY" != "true" ]; then
            echo "NO_ANTHROPIC_SECRET_FOUND"
            exit 2
          fi
          echo "ANTHROPIC_SECRET_AVAILABLE"
