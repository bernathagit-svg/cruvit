name: Batch B Morphology Size Evidence Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-b-morphology-size-evidence-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/morphology-size-evidence-gate-v1.test.mjs tests/design-asset-annual-dormancy-v1.test.mjs tests/lifecycle-evidence-gate-v1.test.mjs
