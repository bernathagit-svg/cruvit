name: CRUVIT Plant Intake E2E Final Production Promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/plant-intake-e2e-final-production-promotion-2026-10-06.yml'

permissions:
  contents: write

jobs:
  promote-verify-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://friendly-taiyaki-64aacb.netlify.app
      MANIFEST_ID: plant-intake-e2e-final-production-promotion-2026-10-05-v1
      BUILDER_PATH: /.netlify/functions/plant-intake-e2e-final-promotion-manifest-builder
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Wait for Netlify builder and materialize exact manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p execution-results
          ok=0
          for i in $(seq 1 90); do
            code="$(curl --silent --show-error -o execution-results/manifest.json -w '%{http_code}' "$BASE_URL$BUILDER_PATH" || true)"
            if [ "$code" = "200" ]               && jq -e --arg id "$MANIFEST_ID" '.contract=="plant-visual-qa-manifest-v1" and .manifestId==$id and .totalJobs==4 and (.rows|length)==4' execution-results/manifest.json >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"
          test "$(jq -r '.productionPromotionAuthorized' execution-results/manifest.json)" = "false"
          mkdir -p data/garden-design/plant-visual-qa-manifests
          cp execution-results/manifest.json "data/garden-design/plant-visual-qa-manifests/$MANIFEST_ID.json"

      - name: Commit manifest evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bernathagit-svg"
          git config user.email "bernat.hagit@gmail.com"
          git add "data/garden-design/plant-visual-qa-manifests/$MANIFEST_ID.json"
          git commit -m "garden-design: materialize final Plant Intake E2E promotion manifest"
          git push origin HEAD:main

      - name: Wait for manifest and approval on Netlify
        shell: bash
        run: |
          set -euo pipefail
          manifest_ok=0
          approval_ok=0
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error               "$BASE_URL/data/garden-design/plant-visual-qa-manifests/$MANIFEST_ID.json"               -o execution-results/live-manifest.json               && jq -e --arg id "$MANIFEST_ID" '.manifestId==$id and .totalJobs==4' execution-results/live-manifest.json >/dev/null 2>&1; then
              manifest_ok=1
            fi
            if curl --fail --silent --show-error               "$BASE_URL/data/garden-design/plant-visual-production-promotion-approvals/$MANIFEST_ID.json"               -o execution-results/live-approval.json               && jq -e --arg id "$MANIFEST_ID" '.contract=="plant-visual-production-promotion-approval-v1" and .manifestId==$id and (.scope.candidateJobs|length)==4' execution-results/live-approval.json >/dev/null 2>&1; then
              approval_ok=1
            fi
            if [ "$manifest_ok" = "1" ] && [ "$approval_ok" = "1" ]; then break; fi
            sleep 10
          done
          test "$manifest_ok" = "1"
          test "$approval_ok" = "1"

      - name: Revalidate live promotion readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "$BASE_URL/.netlify/functions/plant-visual-live-promotion-readiness?manifest=$MANIFEST_ID"             | tee execution-results/live-readiness.json
          test "$(jq -r '.ok' execution-results/live-readiness.json)" = "true"
          test "$(jq -r '.totalJobs' execution-results/live-readiness.json)" = "4"
          test "$(jq -r '.readyJobs' execution-results/live-readiness.json)" = "4"
          test "$(jq -r '.blockedJobs' execution-results/live-readiness.json)" = "0"
          test "$(jq -r '.onboardingSummary.allReady' execution-results/live-readiness.json)" = "true"

      - name: Promote exact verified candidate bytes to Production R2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X POST "$BASE_URL/.netlify/functions/plant-visual-promote-manifest"             -H 'content-type: application/json'             --data "{\"manifestId\":\"$MANIFEST_ID\"}"             | tee execution-results/promotion-result.json
          test "$(jq -r '.ok' execution-results/promotion-result.json)" = "true"
          test "$(jq -r '.totalJobs' execution-results/promotion-result.json)" = "4"
          test "$(jq -r '.promotedOrVerified' execution-results/promotion-result.json)" = "4"
          test "$(jq -r '.failed' execution-results/promotion-result.json)" = "0"
          test "$(jq '[.results[]|select(.ok==true and (.code=="PROMOTED_AND_VERIFIED" or .code=="ALREADY_PROMOTED_IDENTICAL"))]|length' execution-results/promotion-result.json)" = "4"

      - name: Verify Production R2 readback checksums
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "$BASE_URL/.netlify/functions/plant-visual-production-promotion-status?manifest=$MANIFEST_ID"             | tee execution-results/production-status.json
          test "$(jq -r '.verified' execution-results/production-status.json)" = "4"
          test "$(jq -r '.missing' execution-results/production-status.json)" = "0"
          test "$(jq -r '.mismatch' execution-results/production-status.json)" = "0"

      - name: Activate only checksum-verified production objects in Registry
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { activateVerifiedPromotionResults } from './modules/garden-design/asset-factory-v1/plant-visual-registry-activation-v1.js';

          const manifestId=process.env.MANIFEST_ID;
          const registryPath='./modules/garden-design/assets/plants/design-asset-registry-v1.json';
          const manifestPath='./data/garden-design/plant-visual-qa-manifests/'+manifestId+'.json';
          const statusPath='./execution-results/production-status.json';

          const registry=JSON.parse(fs.readFileSync(registryPath,'utf8'));
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          const status=JSON.parse(fs.readFileSync(statusPath,'utf8'));

          if(Number(status.verified)!==4 || Number(status.missing)!==0 || Number(status.mismatch)!==0){
            throw new Error('PRODUCTION_STATUS_NOT_4_OF_4_VERIFIED');
          }

          const promotionResult={
            manifestId,
            results:(status.rows||[]).map(r=>({
              jobId:r.jobId,
              ok:r.status==='VERIFIED',
              code:r.status==='VERIFIED'?'ALREADY_PROMOTED_IDENTICAL':r.status,
              productionKey:r.productionKey,
              sha256:r.sha256,
              bytes:r.bytes,
              wrote:false
            }))
          };

          const activation=activateVerifiedPromotionResults(registry,manifest,promotionResult);
          if(activation.activatedJobs!==4 || activation.skippedJobs!==0){
            console.error(JSON.stringify(activation,null,2));
            throw new Error('REGISTRY_ACTIVATION_NOT_4_OF_4');
          }

          fs.writeFileSync(registryPath,JSON.stringify(activation.registry,null,2)+'\n');
          fs.mkdirSync('./data/garden-design/plant-visual-registry-activation-results',{recursive:true});
          fs.writeFileSync(
            './data/garden-design/plant-visual-registry-activation-results/'+manifestId+'.json',
            JSON.stringify({
              version:activation.version,
              manifestId:activation.manifestId,
              activatedJobs:activation.activatedJobs,
              skippedJobs:activation.skippedJobs,
              activated:activation.activated,
              activatedAt:'2026-10-06',
              source:'verified Production R2 status after owner-approved final Plant Intake E2E promotion'
            },null,2)+'\n'
          );
          console.log(JSON.stringify({activatedJobs:activation.activatedJobs,skippedJobs:activation.skippedJobs}));
          NODE

      - name: Commit verified Registry activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bernathagit-svg"
          git config user.email "bernat.hagit@gmail.com"
          git add             modules/garden-design/assets/plants/design-asset-registry-v1.json             "data/garden-design/plant-visual-registry-activation-results/$MANIFEST_ID.json"
          git commit -m "garden-design: activate 4 verified Plant Intake E2E production assets"
          git push origin HEAD:main

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plant-intake-e2e-final-production-promotion
          path: execution-results/
          if-no-files-found: warn
          retention-days: 30
