name: CRUVIT Remaining 25 Lifecycle Research V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cruvit-remaining-25-lifecycle-research-v2.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Re-run bounded lifecycle research
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/catalog/end-to-end-batch-b/lifecycle
          slugs=(
            bigleaf-hydrangea blueberry borage broccoli carrot common-jasmine
            english-lavender fig french-marigold garden-pea green-bean
            lesser-bougainvillea lettuce nasturtium peach pear plum pomegranate
            raspberry spearmint spinach watermelon zinnia zucchini strawberry
          )
          for slug in "${slugs[@]}"; do
            curl --fail-with-body --silent --show-error               "https://friendly-taiyaki-64aacb.netlify.app/.netlify/functions/lifecycle-research?slug=$slug"               -o "data/catalog/end-to-end-batch-b/lifecycle/$slug.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='data/catalog/end-to-end-batch-b/lifecycle';
          const files=fs.readdirSync(dir).filter(f=>f.endsWith('.json')&&f!=='summary.json');
          const rows=files.map(f=>JSON.parse(fs.readFileSync(dir+'/'+f,'utf8')));
          const summary={
            contract:'cruvit-e2e-lifecycle-research-summary-v1',
            createdAt:'2026-09-25',
            total:rows.length,
            sourceSupported:rows.filter(x=>x?.result?.state && x.result.state!=='UNKNOWN' && x?.result?.evidenceClass==='SOURCE_SUPPORTED').length,
            resolvedAny:rows.filter(x=>x?.result?.state && x.result.state!=='UNKNOWN').length,
            unknown:rows.filter(x=>!x?.result?.state || x.result.state==='UNKNOWN').length,
            externalRequests:rows.reduce((n,x)=>n+Number(x.externalRequests||0),0),
            paidCalls:0,catalogWrites:0,
            rows:rows.map(x=>({
              canonicalSlug:x.canonicalSlug,
              scientific:x.scientific,
              state:x?.result?.state||'UNKNOWN',
              evidenceClass:x?.result?.evidenceClass||'UNKNOWN',
              code:x?.result?.code||null,
              sourceCount:Array.isArray(x.records)?x.records.length:0
            })).sort((a,b)=>a.canonicalSlug.localeCompare(b.canonicalSlug))
          };
          fs.writeFileSync(dir+'/summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Commit corrected lifecycle evidence
        run: |
          git config user.name "bernathagit-svg"
          git config user.email "bernat.hagit@gmail.com"
          git add data/catalog/end-to-end-batch-b/lifecycle
          git commit -m "catalog: refresh remaining-25 lifecycle research after conflict fix"
          git push origin HEAD:main
