name: Catalog Media Coverage Snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-media-coverage-snapshot.yml'
      - 'data/plant-identity.registry.json'
      - 'data/plants.seed.json'
      - 'modules/catalog-media/active-canonical-image-coverage-v1.js'
      - 'scripts/catalog-media-active-coverage-snapshot-v1.mjs'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/catalog-media-active-coverage-snapshot-v1.mjs
      - run: |
          git config user.name "bernathagit-svg"
          git config user.email "bernat.hagit@gmail.com"
          git add data/catalog-media/active-canonical-image-coverage-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "catalog-media: refresh active canonical image coverage snapshot"
          git push origin HEAD:main
