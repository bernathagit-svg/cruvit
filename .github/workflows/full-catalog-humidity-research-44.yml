name: CRUVIT Full Catalog Humidity Research 44

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-catalog-humidity-research-44.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Run bounded humidity research for 44 plants
        shell: bash
        run: |
          set -euo pipefail
          out="data/catalog/revalidation/humidity-research-44-2026-09-26-v1"
          mkdir -p "$out"
          slugs=(
            artichoke asparagus blackberry blackcurrant blueberry borage boxwood broccoli carrot chestnut
            chives cilantro clematis common-jasmine dill elderberry flowering-dogwood french-marigold garden-pea green-bean
            hazelnut jujube lesser-bougainvillea medlar nasturtium okra parsley peach pear pecan
            pitanga plum raspberry rhubarb sapodilla sea-buckthorn serviceberry spearmint spinach strawberry
            sweet-potato tamarind watermelon zucchini
          )
          test "${#slugs[@]}" -eq 44
          for slug in "${slugs[@]}"; do
            curl --fail-with-body --silent --show-error               "https://friendly-taiyaki-64aacb.netlify.app/.netlify/functions/humidity-research?slug=$slug"               -o "$out/$slug.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='data/catalog/revalidation/humidity-research-44-2026-09-26-v1';
          const files=fs.readdirSync(dir).filter(f=>f.endsWith('.json')&&f!=='summary.json');
          const docs=files.map(f=>JSON.parse(fs.readFileSync(dir+'/'+f,'utf8')));
          const rows=docs.map(d=>({
            canonicalSlug:d.canonicalSlug,
            scientific:d.scientific,
            value:d.result?.value??null,
            evidenceClass:d.result?.evidenceClass||'UNKNOWN',
            transformRef:d.result?.transformRef||null,
            selectedEvidence:d.selectedEvidence||null,
            externalRequests:d.externalRequests||0
          })).sort((a,b)=>a.canonicalSlug.localeCompare(b.canonicalSlug));
          const summary={
            contract:'cruvit-full-catalog-humidity-research-44-v1',
            createdAt:'2026-09-26',
            total:rows.length,
            resolved:rows.filter(x=>x.value!==null).length,
            sourceSupported:rows.filter(x=>x.evidenceClass==='SOURCE_SUPPORTED').length,
            heuristic:rows.filter(x=>x.evidenceClass==='HEURISTIC_ASSERTION').length,
            unknown:rows.filter(x=>x.value===null).length,
            totalExternalRequests:rows.reduce((n,x)=>n+x.externalRequests,0),
            paidCalls:0,
            catalogWrites:0,
            rows
          };
          if(summary.total!==44) throw new Error('EXPECTED_44_RESULTS');
          fs.writeFileSync(dir+'/summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE

      - name: Commit humidity evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bernathagit-svg"
          git config user.email "bernat.hagit@gmail.com"
          git add data/catalog/revalidation/humidity-research-44-2026-09-26-v1
          git commit -m "catalog: record 44-plant humidity research"
          git push origin HEAD:main
