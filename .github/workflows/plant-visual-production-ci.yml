name: Plant Visual Production CI

on:
  push:
    branches: [main]
    paths:
      - 'modules/garden-design/asset-factory-v1/**'
      - 'modules/garden-design/garden-design-asset-registry-v1.js'
      - 'modules/garden-design/assets/plants/design-asset-registry-v1.json'
      - 'scripts/plant-visual-production-wave-v1.mjs'
      - 'tests/plant-visual-production-pipeline-v1.test.mjs'
      - 'data/garden-design/plant-size-authority-policy-v1.json'
      - 'data/garden-design/garden-design-size-preference-registry-v1.json'
      - 'data/garden-design/garden-design-qa-saved-placement-anchor-registry-v1.json'
      - 'data/garden-design/plant-visual-qa-manifests/**'
      - 'scripts/plant-visual-qa-manifest-v1.mjs'
      - 'netlify/functions/plant-visual-qa-candidate.mjs'
      - 'modules/garden-design/asset-factory-v1/plant-size-authority-readiness-v1.js'
      - 'modules/garden-design/asset-factory-v1/production-renderer-qa-preview-v1.js'
      - 'modules/garden-design/asset-factory-v1/plant-visual-qa-manifest-v1.js'
      - 'tests/garden-design-server-persistence-v1.test.mjs'
      - 'modules/garden-design/index.html'
      - 'modules/garden-design/garden-design-server-persistence-v1.js'
      - 'modules/garden-design/garden-design-owned-garden-v1.js'
      - 'data/garden-design/plant-visual-pilot-r2-migration-v1.json'
      - 'app.html'
      - 'modules/garden-design/plant-visual-pilot-qa-v1.html'
      - 'netlify/functions/plant-visual-pilot-qa.mjs'
      - 'netlify/functions/plant-visual-generate-wave-job.mjs'
      - 'netlify/functions/plant-visual-wave-status.mjs'
      - 'data/garden-design/plant-visual-production-wave-execution-manifests/**'
      - 'data/garden-design/plant-visual-production-wave-spend-approvals/**'
      - 'tests/plant-visual-wave-r2-execution-v1.test.mjs'
      - 'scripts/plant-visual-wave-metadata-qa-v1.mjs'
      - 'netlify/functions/plant-visual-model-qa-job.mjs'
      - 'netlify/functions/plant-visual-model-qa-status.mjs'
      - 'data/garden-design/plant-visual-model-qa-plans/**'
      - 'data/garden-design/plant-visual-model-qa-spend-approvals/**'
      - 'tests/plant-visual-model-qa-v1.test.mjs'
      - 'data/garden-design/plant-visual-wave-metadata-qa/**'
      - 'scripts/plant-visual-wave-metadata-qa-v1.mjs'
      - 'netlify/functions/plant-visual-model-qa-job.mjs'
      - 'netlify/functions/plant-visual-model-qa-status.mjs'
      - 'data/garden-design/plant-visual-model-qa-plans/**'
      - 'data/garden-design/plant-visual-model-qa-spend-approvals/**'
      - 'tests/plant-visual-model-qa-v1.test.mjs'
      - 'data/garden-design/plant-visual-wave-metadata-qa/**'
      - '.github/workflows/plant-visual-production-ci.yml'
  pull_request:
    paths:
      - 'modules/garden-design/asset-factory-v1/**'
      - 'modules/garden-design/garden-design-asset-registry-v1.js'
      - 'modules/garden-design/assets/plants/design-asset-registry-v1.json'
      - 'scripts/plant-visual-production-wave-v1.mjs'
      - 'tests/plant-visual-production-pipeline-v1.test.mjs'
      - 'data/garden-design/plant-size-authority-policy-v1.json'
      - 'data/garden-design/garden-design-size-preference-registry-v1.json'
      - 'data/garden-design/garden-design-qa-saved-placement-anchor-registry-v1.json'
      - 'data/garden-design/plant-visual-qa-manifests/**'
      - 'scripts/plant-visual-qa-manifest-v1.mjs'
      - 'netlify/functions/plant-visual-qa-candidate.mjs'
      - 'modules/garden-design/asset-factory-v1/plant-size-authority-readiness-v1.js'
      - 'modules/garden-design/asset-factory-v1/production-renderer-qa-preview-v1.js'
      - 'modules/garden-design/asset-factory-v1/plant-visual-qa-manifest-v1.js'
      - 'tests/garden-design-server-persistence-v1.test.mjs'
      - 'modules/garden-design/index.html'
      - 'modules/garden-design/garden-design-server-persistence-v1.js'
      - 'modules/garden-design/garden-design-owned-garden-v1.js'
      - 'data/garden-design/plant-visual-pilot-r2-migration-v1.json'
      - 'app.html'
      - 'modules/garden-design/plant-visual-pilot-qa-v1.html'
      - 'netlify/functions/plant-visual-pilot-qa.mjs'
      - 'netlify/functions/plant-visual-generate-wave-job.mjs'
      - 'netlify/functions/plant-visual-wave-status.mjs'
      - 'data/garden-design/plant-visual-production-wave-execution-manifests/**'
      - 'data/garden-design/plant-visual-production-wave-spend-approvals/**'
      - 'tests/plant-visual-wave-r2-execution-v1.test.mjs'
      - '.github/workflows/plant-visual-production-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plant-visual-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test plant visual pipeline
        run: node --test tests/plant-visual-production-pipeline-v1.test.mjs

      - name: Test Garden Design persistence
        run: node --test tests/garden-design-server-persistence-v1.test.mjs

      - name: Test Wave 1 R2 execution safety
        run: node --test tests/plant-visual-wave-r2-execution-v1.test.mjs

      - name: Test bounded vision QA
        run: node --test tests/plant-visual-model-qa-v1.test.mjs

      - name: Run Wave 1 metadata QA
        run: node scripts/plant-visual-wave-metadata-qa-v1.mjs --manifest=wave1-2026-09-22-v1

      - name: Prove metadata QA is zero-spend and non-mutating
        run: node -e "const j=JSON.parse(require('fs').readFileSync('data/garden-design/plant-visual-wave-metadata-qa/wave1-2026-09-22-v1.json','utf8')); if(j.paidCalls!==0||j.networkCalls!==0||j.productionWrites!==0||j.registryWrites!==0) process.exit(1); console.log({pass:j.pass,fail:j.fail,total:j.totalJobs});"

      - name: Dry-run production wave planner
        run: node scripts/plant-visual-production-wave-v1.mjs --dry-run --max-jobs-per-wave=24 --max-plants-per-wave=12

      - name: Print Wave 1 audit summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('data/garden-design/plant-visual-production-wave-v1.json', 'utf8'));
          const wave = plan.waves?.[0] || { jobs: [], canonicalSlugs: [] };
          const blockedReasons = {};
          for (const row of plan.blocked || []) {
            const reason = row.reason || 'unknown';
            blockedReasons[reason] = (blockedReasons[reason] || 0) + 1;
          }
          console.log(JSON.stringify({
            version: plan.version,
            totals: {
              totalPlants: plan.totalPlants,
              totalJobs: plan.totalJobs,
              waveCount: plan.waveCount,
              blockedCount: plan.blockedCount
            },
            wave1: {
              waveId: wave.waveId || null,
              plantCount: wave.plantCount || 0,
              jobCount: wave.jobCount || 0,
              canonicalSlugs: wave.canonicalSlugs || [],
              jobs: (wave.jobs || []).map((job) => ({
                jobId: job.jobId,
                canonicalSlug: job.canonicalSlug,
                visualForm: job.visualForm,
                architectureMode: job.architectureMode,
                growthStage: job.growthStage,
                phenology: job.phenology,
                priorityBand: job.priorityBand,
                productionPriorityScore: job.productionPriorityScore,
                quality: job.qualityPlan?.quality,
                detailClass: job.qualityPlan?.detailClass
              }))
            },
            blockedReasonCounts: blockedReasons,
            safety: {
              planningOnly: plan.planningOnly,
              networkCalls: plan.networkCalls,
              paidCalls: plan.paidCalls,
              registryWrites: plan.registryWrites
            }
          }, null, 2));
          NODE

      - name: Prove zero paid/network execution
        run: |
          node -e "const r=require('fs').readFileSync('data/garden-design/plant-visual-production-wave-v1.json','utf8'); const j=JSON.parse(r); if(j.networkCalls!==0||j.paidCalls!==0||j.registryWrites!==0) process.exit(1); console.log({networkCalls:j.networkCalls,paidCalls:j.paidCalls,registryWrites:j.registryWrites,waveCount:j.waveCount,totalJobs:j.totalJobs});"

      - name: Upload dry-run production plan
        uses: actions/upload-artifact@v4
        with:
          name: plant-visual-production-wave-v1
          path: data/garden-design/plant-visual-production-wave-v1.json
          if-no-files-found: error
          retention-days: 14
