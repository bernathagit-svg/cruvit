name: Humidity Evidence Gate Check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/humidity-evidence-gate-check.yml'
      - 'modules/catalog/humidity-evidence-gate-v1.js'
      - 'tests/humidity-evidence-gate-v1.test.mjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/humidity-evidence-gate-v1.test.mjs
