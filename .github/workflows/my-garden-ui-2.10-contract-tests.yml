name: My Garden UI 2.10 contract tests

on:
  push:
    branches:
      - my-garden-ui-2.10-contract-20261002
      - fix/plant-id-mygarden-unassessed-20261005
  pull_request:
    branches:
      - my-garden-ui-2.10-contract-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  my-garden-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated My Garden v2 tests
        run: node --test tests/my-garden-v2*.test.mjs

  plant-id-mygarden-contract:
    name: Plant ID → My Garden contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run atomic Add Plant contract tests
        run: |
          node --test \
            tests/add-garden-plant-atomic-rpc-contract.test.mjs \
            tests/add-plant-atomic-command.test.mjs \
            tests/plant-identifier-mygarden-wiring-v1.test.mjs \
            tests/my-garden-v2-add-plant-contract.test.mjs \
            tests/garden-profile-plants-v1-contract.test.mjs \
            tests/my-garden-v2-unassessed-health-migration.test.mjs \
            tests/my-garden-v2-read-model.test.mjs \
            tests/my-garden-v2-plant-detail-base.test.mjs \
            tests/my-garden-v2-task-projection.test.mjs

  plant-id-mygarden-atomic-db:
    name: Plant ID → My Garden atomic DB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Initialize local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
      - name: Start local Supabase
        run: supabase start
      - name: Apply repository migrations to local Supabase
        run: supabase db reset
      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "LOCAL_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Install CI-only atomic failure fixture
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/plant-identifier-atomic-rpc-failure-fixture.sql
      - name: Run real Postgres atomic Add Plant E2E
        run: node --test tests/plant-identifier-mygarden-atomic-rpc-live.test.mjs
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
