name: My Garden UI 2.10 contract tests

on:
  push:
    branches:
      - my-garden-ui-2.10-contract-20261002
      - fix/plant-id-mygarden-unassessed-20261005
  pull_request:
    branches:
      - my-garden-ui-2.10-contract-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  my-garden-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated My Garden v2 tests
        run: node --test tests/my-garden-v2*.test.mjs

  plant-id-mygarden-e2e:
    name: Plant ID → My Garden atomic E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run atomic Add Plant contract tests
        run: |
          node --test \
            tests/add-garden-plant-atomic-rpc-contract.test.mjs \
            tests/add-plant-atomic-command.test.mjs \
            tests/plant-identifier-mygarden-wiring-v1.test.mjs \
            tests/my-garden-v2-add-plant-contract.test.mjs \
            tests/garden-profile-plants-v1-contract.test.mjs \
            tests/my-garden-v2-unassessed-health-migration.test.mjs \
            tests/my-garden-v2-read-model.test.mjs \
            tests/my-garden-v2-plant-detail-base.test.mjs \
            tests/my-garden-v2-task-projection.test.mjs
      - name: Install app dependencies
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare isolated local Supabase project
        shell: bash
        run: |
          rm -rf .ci-atomic
          mkdir -p .ci-atomic
          cd .ci-atomic
          supabase init
          mkdir -p supabase/migrations
          cp ../supabase/migrations/20250828120000_garden_profiles_v0.sql supabase/migrations/
          cp ../supabase/migrations/20250828230000_garden_plants_v1.sql supabase/migrations/
          cp ../supabase/migrations/20250829100000_garden_tasks_v1.sql supabase/migrations/
          cp ../supabase/migrations/20260911180000_garden_os_spine_v1.sql supabase/migrations/
          cp ../supabase/migrations/20260913190000_garden_areas_v1.sql supabase/migrations/
          cp ../supabase/migrations/20261005175958_garden_plants_unassessed_health_v2.sql supabase/migrations/
          cp ../supabase/migrations/20261005190000_add_garden_plant_atomic_v1.sql supabase/migrations/
      - name: Start isolated local Supabase
        working-directory: .ci-atomic
        run: supabase start
      - name: Export local Supabase environment
        shell: bash
        working-directory: .ci-atomic
        run: |
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "LOCAL_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Install CI-only atomic failure fixture
        run: psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f tests/sql/plant-identifier-atomic-rpc-failure-fixture.sql
      - name: Run real Postgres atomic Add Plant E2E
        run: node --test tests/plant-identifier-mygarden-atomic-rpc-live.test.mjs
      - name: Stop local Supabase
        if: always()
        working-directory: .ci-atomic
        run: supabase stop --no-backup
