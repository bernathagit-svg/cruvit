name: My Garden UI 2.10 contract tests

on:
  push:
    branches:
      - my-garden-ui-2.10-contract-20261002
  pull_request:
    branches:
      - my-garden-ui-2.10-contract-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  my-garden-and-plant-id:
    name: My Garden + Plant ID atomic E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cruvit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cruvit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGPASSWORD: postgres
      ATOMIC_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/cruvit_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run isolated My Garden v2 tests
        run: node --test tests/my-garden-v2*.test.mjs

      - name: Run atomic Add Plant contract tests
        run: |
          node --test             tests/add-garden-plant-atomic-rpc-contract.test.mjs             tests/add-plant-atomic-command.test.mjs             tests/plant-identifier-mygarden-write-bridge-v1.test.mjs             tests/plant-identifier-mygarden-wiring-v1.test.mjs             tests/my-garden-v2-add-plant-contract.test.mjs             tests/garden-profile-plants-v1-contract.test.mjs             tests/my-garden-v2-unassessed-health-migration.test.mjs             tests/my-garden-v2-read-model.test.mjs             tests/my-garden-v2-plant-detail-base.test.mjs             tests/my-garden-v2-task-projection.test.mjs

      - name: Install PostgreSQL CI client dependency
        run: npm install --no-save --package-lock=false pg@8

      - name: Bootstrap isolated PostgreSQL auth/RLS harness
        run: |
          psql "$ATOMIC_DB_URL" -v ON_ERROR_STOP=1             -f tests/sql/atomic-postgres-bootstrap.sql

      - name: Apply Garden migrations to isolated PostgreSQL
        run: |
          psql "$ATOMIC_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20250828120000_garden_profiles_v0.sql
          psql "$ATOMIC_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20250828230000_garden_plants_v1.sql
          psql "$ATOMIC_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20250829100000_garden_tasks_v1.sql
          psql "$ATOMIC_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260911180000_garden_os_spine_v1.sql
          psql "$ATOMIC_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913190000_garden_areas_v1.sql
          psql "$ATOMIC_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261005175958_garden_plants_unassessed_health_v2.sql
          psql "$ATOMIC_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261005190000_add_garden_plant_atomic_v1.sql
          psql "$ATOMIC_DB_URL" -v ON_ERROR_STOP=1             -f tests/sql/atomic-postgres-post-migrations.sql

      - name: Run real PostgreSQL atomic Add Plant E2E
        run: node --test tests/plant-identifier-mygarden-atomic-postgres-ci.test.mjs
