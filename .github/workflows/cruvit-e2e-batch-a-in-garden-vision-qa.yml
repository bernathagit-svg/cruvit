          curl --fail-with-body --silent --show-error -X POST "$BASE_URL/.netlify/functions/plant-visual-in-garden-vision-qa-job" -H 'content-type: application/json' --data '{"runId":"cruvit-e2e-batch-a-in-garden-vision-qa-2026-09-25-v1","jobId":"apple__mature__tree__dormant__v1"}' | tee execution-results/03.json
