name: CRUVIT E2E Batch A In-Garden Vision QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cruvit-e2e-batch-a-in-garden-vision-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://friendly-taiyaki-64aacb.netlify.app
      RUN_ID: cruvit-e2e-batch-a-in-garden-vision-qa-2026-09-25-v1
    steps:
      - name: Apple mature vegetative
        continue-on-error: true
        run: |
          mkdir -p execution-results
          curl --fail-with-body --silent --show-error -X POST "$BASE_URL/.netlify/functions/plant-visual-in-garden-vision-qa-job" -H 'content-type: application/json' --data '{"runId":"cruvit-e2e-batch-a-in-garden-vision-qa-2026-09-25-v1","jobId":"apple__mature__tree__vegetative__v1"}' | tee execution-results/01.json
      - name: Apple mature fruiting
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error -X POST "$BASE_URL/.netlify/functions/plant-visual-in-garden-vision-qa-job" -H 'content-type: application/json' --data '{"runId":"cruvit-e2e-batch-a-in-garden-vision-qa-2026-09-25-v1","jobId":"apple__mature__tree__fruiting__v1"}' | tee execution-results/02.json
      - name: Apple mature dormant
