name: CRUVIT E2E Batch B Visual Wave

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cruvit-e2e-batch-b-visual-wave.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://friendly-taiyaki-64aacb.netlify.app
      RUN_ID: cruvit-e2e-batch-b-visual-wave-001-2026-09-25-v1
    steps:
      - name: Bigleaf hydrangea mature vegetative
        continue-on-error: true
        run: |
          mkdir -p execution-results
          curl --fail-with-body --silent --show-error -X POST "$BASE_URL/.netlify/functions/plant-visual-generate-wave-job" -H 'content-type: application/json' --data '{"runId":"cruvit-e2e-batch-b-visual-wave-001-2026-09-25-v1","jobId":"bigleaf-hydrangea__mature__shrub__vegetative__v1"}' | tee execution-results/01.json
