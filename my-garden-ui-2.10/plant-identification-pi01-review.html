<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRUVIT — Plant Identification PI-01 Approved</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0d2317}
body{display:flex;justify-content:center;align-items:flex-start}
.pi01-approved{
  position:relative;
  width:min(100vw,547px);
  min-height:100svh;
  background:#f5efdf;
  overflow:hidden;
}
.pi01-approved img{
  display:block;
  width:100%;
  height:auto;
  min-height:100svh;
  object-fit:cover;
  object-position:center top;
  user-select:none;
  -webkit-user-drag:none;
}
.hotspot{
  position:absolute;
  display:block;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  cursor:pointer;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
.hotspot:focus-visible{outline:2px solid rgba(255,255,255,.9);outline-offset:-4px;border-radius:18px}
.take-photo{left:9.5%;top:48.7%;width:81%;height:7.7%}
.gallery{left:9.5%;top:57.5%;width:81%;height:7.2%}
.help-care{left:7.5%;top:68.1%;width:21%;height:12.8%}
.help-fit{left:29.5%;top:68.1%;width:21%;height:12.8%}
.help-growing{left:51.5%;top:68.1%;width:21%;height:12.8%}
.help-save{left:73.5%;top:68.1%;width:19%;height:12.8%}
.nav-home{left:3%;bottom:2.2%;width:18%;height:8.8%}
.nav-garden{left:21%;bottom:2.2%;width:20%;height:8.8%}
.nav-identify{left:41%;bottom:1.5%;width:18%;height:10.8%}
.nav-design{left:59%;bottom:2.2%;width:20%;height:8.8%}
.nav-shop{left:79%;bottom:2.2%;width:18%;height:8.8%}
@media (min-aspect-ratio: 1/1){
  .pi01-approved{box-shadow:0 0 60px rgba(0,0,0,.35)}
}
</style>
</head>
<body>
<main class="pi01-approved" aria-label="CRUVIT Plant Identification PI-01 approved visual implementation">
  <img src="/assets/approved/pi01-option4-approved-screen.jpg"
       alt="CRUVIT Plant Identification — approved Option 4 Friendly & Visual screen">
  <button class="hotspot take-photo" type="button" aria-label="Take a photo"></button>
  <button class="hotspot gallery" type="button" aria-label="Choose from gallery"></button>
  <button class="hotspot help-care" type="button" aria-label="Plant care tips"></button>
  <button class="hotspot help-fit" type="button" aria-label="Is it right for my garden?"></button>
  <button class="hotspot help-growing" type="button" aria-label="Growing conditions"></button>
  <button class="hotspot help-save" type="button" aria-label="Save to My Garden"></button>
  <button class="hotspot nav-home" type="button" aria-label="Home"></button>
  <button class="hotspot nav-garden" type="button" aria-label="My Garden"></button>
  <button class="hotspot nav-identify" type="button" aria-label="Identify"></button>
  <button class="hotspot nav-design" type="button" aria-label="Design"></button>
  <button class="hotspot nav-shop" type="button" aria-label="Shop"></button>
</main>
</body>
</html>
