<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#06190e">
  <title>CRUVIT · Upcoming · Visual Match Review</title>
  <link rel="stylesheet" href="../modules/my-garden-v2/visual-contract/approved-upcoming.css?v=20261003-exact11">
  <style>
    html,body{margin:0;min-height:100%;background:#6c7551}
    body{
      display:flex;justify-content:center;align-items:flex-start;
      background:
        radial-gradient(circle at 18% 8%,rgba(198,208,149,.5),transparent 28%),
        radial-gradient(circle at 88% 12%,rgba(61,78,46,.48),transparent 30%),
        linear-gradient(180deg,#7e875e,#44563e);
      padding:8px 0 28px;
    }
    .phone-shell{
      position:relative;width:571px;max-width:calc(100vw - 14px);
      border:5px solid #050906;border-radius:61px;overflow:hidden;
      background:#07150d;box-shadow:0 18px 52px rgba(0,0,0,.35),0 0 0 2px rgba(225,231,199,.5);
    }
    #upcoming-review-root{width:100%;min-height:1284px}
    .statusbar{
      position:absolute;z-index:20;top:18px;left:40px;right:38px;height:24px;
      display:flex;align-items:center;justify-content:space-between;
      color:#fff;font:600 19px/1 Inter,Arial,sans-serif;pointer-events:none;
      text-shadow:0 1px 2px rgba(0,0,0,.45)
    }
    .status-icons{display:flex;align-items:center;gap:8px;font-size:15px}
    .signal-icon{width:24px;height:16px;fill:#fff}.wifi-icon{width:24px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}.battery{width:29px;height:13px;border:2px solid #fff;border-radius:4px;position:relative}
    .battery:after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;border-radius:1px;background:#fff}
    .battery:before{content:"";position:absolute;inset:2px;background:#fff;border-radius:1px}
    .home-indicator-shell{position:absolute;z-index:30;left:50%;bottom:9px;transform:translateX(-50%);width:202px;height:6px;border-radius:999px;background:#f5f5ef;pointer-events:none}
    @media(max-width:580px){
      body{padding:0;background:#07150d}
      .phone-shell{width:100vw;max-width:none;border:0;border-radius:0;box-shadow:none}
      .statusbar{left:28px;right:28px}
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div class="statusbar" aria-hidden="true">
      <span>9:41</span>
      <span class="status-icons">
  <svg class="signal-icon" viewBox="0 0 24 16" aria-hidden="true"><rect x="1" y="10" width="3" height="5" rx="1"/><rect x="7" y="7" width="3" height="8" rx="1"/><rect x="13" y="4" width="3" height="11" rx="1"/><rect x="19" y="1" width="3" height="14" rx="1"/></svg>
  <svg class="wifi-icon" viewBox="0 0 24 18" aria-hidden="true"><path d="M2 5.5C7.6.5 16.4.5 22 5.5"/><path d="M5.5 9c3.8-3.3 9.2-3.3 13 0"/><path d="M9 12.5c1.7-1.5 4.3-1.5 6 0"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"/></svg>
  <span class="battery"></span>
</span>
    </div>
    <div id="upcoming-review-root"></div><div class="home-indicator-shell" aria-hidden="true"></div>
  </div>
  <script type="module" src="./upcoming-review.js?v=20261003-exact11"></script>
</body>
</html>
