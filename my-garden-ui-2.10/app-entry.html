<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#22351f">
<title>CRUVIT · Module Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#162416;font-family:Inter,Arial,sans-serif;color:white;overflow-x:hidden}
body{min-height:100dvh}
.stage{position:relative;min-height:100dvh;overflow:hidden;background:#162416}
.shell{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;filter:none}
.overlay{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column}
.header-hot{position:absolute;z-index:5;border:0;background:transparent}
.lang-hot{right:15%;top:3.5%;width:12%;height:7%}.profile-hot{right:3%;top:3.5%;width:10%;height:7%}
.carousel{position:absolute;left:0;right:0;top:24%;height:58%;touch-action:pan-y;user-select:none;overflow:visible}
.card{position:absolute;left:50%;top:50%;width:min(63vw,410px);aspect-ratio:0.73;transform:translate(-50%,-50%);border-radius:28px;overflow:hidden;box-shadow:0 24px 55px rgba(0,0,0,.35);transition:transform .42s ease,opacity .42s ease,filter .42s ease;cursor:pointer;background:#233b23;border:1px solid rgba(255,255,255,.16)}
.card img,.card video{display:block;width:100%;height:100%;object-fit:cover}.card video{position:absolute;inset:0;z-index:1;background:#233b23}.card .poster{position:relative;z-index:0}.card.center .poster.has-motion{visibility:hidden}
.card.side-left{transform:translate(-105%,-50%) scale(.86);opacity:.72;filter:saturate(.82);z-index:1}
.card.side-right{transform:translate(5%,-50%) scale(.86);opacity:.72;filter:saturate(.82);z-index:1}
.card.center{transform:translate(-50%,-50%) scale(1);opacity:1;z-index:3}
.card.far-left{transform:translate(-150%,-50%) scale(.72);opacity:0;z-index:0}
.card.far-right{transform:translate(50%,-50%) scale(.72);opacity:0;z-index:0}
.card .go{position:absolute;inset:0;border:0;background:transparent;cursor:pointer}
.dots{position:absolute;left:50%;top:83%;transform:translateX(-50%);display:flex;gap:10px;z-index:4}
.dot{width:8px;height:8px;border-radius:50%;border:0;background:rgba(255,255,255,.38);padding:0}.dot.active{width:24px;border-radius:999px;background:#fff}
.bottom-hot{position:absolute;bottom:0;height:11%;z-index:5;border:0;background:transparent}
.nav-home{left:0;width:20%}.nav-garden{left:20%;width:20%}.nav-add{left:40%;width:20%}.nav-notif{left:60%;width:20%}.nav-more{left:80%;width:20%}
@media (max-width:620px){.carousel{top:25%;height:54%}.card{width:64vw;border-radius:24px}.dots{top:80.5%}}
</style>
</head>
<body>
<main class="stage">
  <img class="shell" src="https://smart-style-all-three--friendly-taiyaki-64aacb.netlify.app/assets/approved-shell.png" alt="">
  <div class="overlay">
    <button class="header-hot lang-hot" aria-label="Language"></button>
    <button class="header-hot profile-hot" aria-label="Profile"></button>
    <section id="carousel" class="carousel" aria-label="CRUVIT modules"></section>
    <div id="dots" class="dots" aria-label="Module pages"></div>
    <a class="bottom-hot nav-home" href="./app-entry.html" aria-label="Home"></a>
    <a class="bottom-hot nav-garden" href="./index.html?v=20261004-home-fullscreen2" aria-label="My Garden"></a>
    <a class="bottom-hot nav-add" href="./approved/add-plant-approved.html" aria-label="Add"></a>
    <a class="bottom-hot nav-notif" href="./notifications-review.html" aria-label="Notifications"></a>
    <a class="bottom-hot nav-more" href="/app.html?my-garden-v2=1" aria-label="More"></a>
  </div>
</main>
<script>
const A='https://smart-style-all-three--friendly-taiyaki-64aacb.netlify.app/assets/';
const modules=[
 {id:'garden-design',center:A+'card-garden-design-center.png',side:A+'card-garden-design.png',motion:A+'garden-design-approved-motion.mp4',href:'/modules/garden-design/'},
 {id:'my-garden',center:A+'card-my-garden.png',side:A+'card-my-garden-side.png',motion:A+'my-garden-approved-motion.mp4',href:'./index.html?v=20261004-home-fullscreen2'},
 {id:'plant-doctor',center:A+'card-plant-doctor-rectified.png',side:A+'card-plant-doctor-rectified.png',motion:A+'plant-doctor-approved-motion.mp4',href:'/modules/plant-doctor/'},
 {id:'plant-id',center:A+'card-plant-id-approved-exact.webp',side:A+'card-plant-id-approved-exact.webp',motion:A+'plant-identification-approved-motion.mp4',href:'/modules/plant-identifier/'},
 {id:'smart',center:A+'card-smart-approved-exact.webp',side:A+'card-smart-approved-exact.webp',motion:A+'smart-recommendations-approved-motion.mp4',href:'/app.html?smart-recommendations=1'},
 {id:'shop',center:A+'card-shop-approved-hq.webp',side:A+'card-shop-approved-hq.webp',motion:A+'shop-approved-motion.mp4',href:'/store/'}
];
let active=1,downX=null,moved=false;
const carousel=document.getElementById('carousel'),dots=document.getElementById('dots');
function render(){
 carousel.innerHTML='';
 modules.forEach((m,i)=>{
   const d=(i-active+modules.length)%modules.length;
   const back=(active-i+modules.length)%modules.length;
   let cls='far-right';
   if(i===active) cls='center';
   else if(back===1) cls='side-left';
   else if(d===1) cls='side-right';
   else if(back===2||back===3) cls='far-left';
   const a=document.createElement('a');
   a.className='card '+cls;a.href=m.href;a.dataset.index=i;a.setAttribute('aria-label',m.id);
   const poster=i===active?m.center:m.side;
   a.innerHTML='<img class="poster'+(i===active&&m.motion?' has-motion':'')+'" draggable="false" src="'+poster+'" alt=""><span class="go"></span>';
   if(i===active&&m.motion){
     const v=document.createElement('video');
     v.src=m.motion;
     v.muted=true;
     v.playsInline=true;
     v.autoplay=true;
     v.loop=false;
     v.preload='auto';
     v.poster=m.center;
     v.setAttribute('aria-hidden','true');
     v.addEventListener('error',()=>{v.remove();const p=a.querySelector('.poster');if(p)p.style.visibility='visible'},{once:true});
     a.insertBefore(v,a.querySelector('.go'));
     requestAnimationFrame(()=>{v.currentTime=0;v.play().catch(()=>{const p=a.querySelector('.poster');if(p)p.style.visibility='visible'})});
   }
   a.addEventListener('click',e=>{if(i!==active||moved){e.preventDefault();active=i;moved=false;render()}});
   carousel.appendChild(a);
 });
 dots.innerHTML='';
 modules.forEach((_,i)=>{const b=document.createElement('button');b.className='dot'+(i===active?' active':'');b.setAttribute('aria-label','Module '+(i+1));b.onclick=()=>{active=i;render()};dots.appendChild(b)});
}
function shift(dir){active=(active+dir+modules.length)%modules.length;render()}
carousel.addEventListener('pointerdown',e=>{downX=e.clientX;moved=false;carousel.setPointerCapture?.(e.pointerId)});
carousel.addEventListener('pointermove',e=>{if(downX!==null&&Math.abs(e.clientX-downX)>10)moved=true});
carousel.addEventListener('pointerup',e=>{if(downX===null)return;const dx=e.clientX-downX;if(Math.abs(dx)>45)shift(dx<0?1:-1);downX=null;setTimeout(()=>moved=false,0)});
render();
</script>
</body></html>
