<input id="galleryInput" type="file" accept="image/*">
<div id="toast" class="toast hidden" role="status"></div>

<script>
const NAMES={"lemon-01":"Lemon tree","olive-01":"Olive tree","lavender-01":"Lavender","rosemary-01":"Rosemary",
"hydrangea-01":"Hydrangea","bougainvillea-01":"Bougainvillea","agave-01":"Agave","bird-01":"Bird of paradise","mint-01":"Mint"};
const PREFIX='cruvit-myplants-user-photo-v1:';let active=null;
const $=s=>document.querySelector(s),sheet=$('#sheet'),scrim=$('#scrim'),cam=$('#cameraInput'),gal=$('#galleryInput'),toast=$('#toast');
const key=id=>PREFIX+id,saved=id=>localStorage.getItem(key(id));
function msg(t){toast.textContent=t;toast.classList.remove('hidden');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.add('hidden'),1800)}
function render(id){
 const v=saved(id);
 document.querySelectorAll(`[data-card-photo="${id}"]`).forEach(im=>{if(v){im.src=v;im.hidden=false}else{im.hidden=true;im.removeAttribute('src')}});
 if(id==='lemon-01'){
  for(const el of [$('#heroUserPhoto'),$('#detailCardUserPhoto')]){if(v){el.src=v;el.hidden=false}else{el.hidden=true;el.removeAttribute('src')}}
  $('#heroFade').classList.toggle('hidden',!v);
  document.querySelectorAll('[data-detail-hero-photo="lemon-01"]').forEach(el=>{if(v){el.src=v;el.hidden=false}else{el.hidden=true;el.removeAttribute('src')}});
  document.querySelectorAll('[data-detail-hero-fade="lemon-01"]').forEach(el=>el.hidden=!v);
 }
}
Object.keys(NAMES).forEach(render);
function open(id){active=id;$('#title').textContent=NAMES[id];$('#restore').hidden=!saved(id);sheet.classList.remove('hidden');scrim.classList.remove('hidden')}
function close(){sheet.classList.add('hidden');scrim.classList.add('hidden');active=null}
document.addEventListener('click',e=>{
 const c=e.target.closest('[data-camera]');if(c){e.preventDefault();e.stopPropagation();open(c.dataset.camera);return}
 if(e.target.closest('[data-open-lemon]')){
  $('#myplants').classList.add('hidden');
  ['detail','care','schedule','history'].forEach(id=>$('#'+id)?.classList.add('hidden'));
  $('#detail').classList.remove('hidden');
  render('lemon-01');
  return
 }
 const tab=e.target.closest('[data-detail-tab]');
 if(tab){
  ['detail','care','schedule','history'].forEach(id=>$('#'+id)?.classList.add('hidden'));
  $('#'+tab.dataset.detailTab).classList.remove('hidden');
  render('lemon-01');
  window.scrollTo(0,0);
  return
 }
 if(e.target.closest('[data-back]')){
  ['detail','care','schedule','history'].forEach(id=>$('#'+id)?.classList.add('hidden'));
  $('#myplants').classList.remove('hidden');
  render('lemon-01');
  window.scrollTo(0,0);
  return
 }
});
scrim.onclick=close;$('#cancel').onclick=close;$('#take').onclick=()=>cam.click();$('#gallery').onclick=()=>gal.click();
$('#restore').onclick=()=>{if(!active)return;const id=active;localStorage.removeItem(key(id));render(id);close();msg('CRUVIT photo restored')};
async function use(file,id){
 if(!file||!id)return;if(!file.type.startsWith('image/')){msg('Please choose an image');return}
 const u=URL.createObjectURL(file);
 try{const im=new Image();im.src=u;await im.decode();const max=1400,s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
 const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.naturalWidth*s));cv.height=Math.max(1,Math.round(im.naturalHeight*s));
 cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const d=cv.toDataURL('image/jpeg',.88);
 try{localStorage.setItem(key(id),d)}catch{msg('This photo is too large for the local preview');return}
 render(id);close();msg('Personal photo applied to '+NAMES[id]);}finally{URL.revokeObjectURL(u)}
}
cam.onchange=async e=>{const id=active,f=e.target.files?.[0];e.target.value='';await use(f,id)};
gal.onchange=async e=>{const id=active,f=e.target.files?.[0];e.target.value='';await use(f,id)};
</script>
<script>
(function(){
  function addNav(screen){
    if(!screen || screen.querySelector('[data-approved-nav]')) return;
    const items=[
      ['approved-nav-home','../index.html','Home'],
      ['approved-nav-mygarden','../index.html','My Garden'],
      ['approved-nav-add','./add-plant-approved.html','Add Plant'],
      ['approved-nav-design','/modules/garden-design/','Design'],
      ['approved-nav-shop','/store/','Shop']
    ];
    for(const [cls,href,label] of items){
      const a=document.createElement('a');
      a.className='approved-nav-hit '+cls;
      a.href=href;a.setAttribute('aria-label',label);a.dataset.approvedNav='1';
      screen.appendChild(a);
    }
    const top=document.createElement('a');
    top.className='approved-top-home';top.href='../index.html';top.setAttribute('aria-label','Back to My Garden');top.dataset.approvedNav='1';
    screen.appendChild(top);
  }
  document.querySelectorAll('.screen').forEach(addNav);
})();
</script></body></html>
