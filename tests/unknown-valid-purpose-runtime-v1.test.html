<!doctype html>
<meta charset="utf-8">
<title>CRUVIT UNKNOWN_VALID Purpose Runtime V1</title>
<style>body{font:14px system-ui;background:#111;color:#eee;margin:20px}pre{white-space:pre-wrap;background:#1b1b1b;padding:12px}iframe{position:absolute;left:-9999px;width:1px;height:1px}.pass{color:#8fe3a1}.fail{color:#ff9c9c}</style>
<h1>UNKNOWN_VALID Purpose Runtime V1</h1><p id="status">Running…</p><pre id="out"></pre><div id="host"></div>
<script>
const SLUGS=['aloe-vera','basil','black-eyed-susan-vine','cyclamen','ficus-benjamina','hibiscus','rosemary','strelitzia'];
const EDIBLE_EXPECTED=new Set(['basil','rosemary']);
const FLOWERING_EXPECTED=new Set(['black-eyed-susan-vine','cyclamen','hibiscus','strelitzia']);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(fn,ms=30000){const t=Date.now();while(Date.now()-t<ms){try{if(fn())return true}catch{}await sleep(100)}return false}
(async()=>{
 const iframe=document.createElement('iframe');iframe.src='../app.html?unknownPurposeV1='+Date.now();document.getElementById('host').appendChild(iframe);
 await new Promise((res,rej)=>{iframe.onload=res;iframe.onerror=rej});const cw=iframe.contentWindow;
 if(!await waitFor(()=>cw&&typeof cw.compileSmartRecSessionFilters==='function'&&typeof cw.smartRecEvaluateSuitability==='function'))throw new Error('runtime not ready');
 const failures=[],rows=[];
 function filtered(answers){
  const compiled=cw.compileSmartRecSessionFilters(answers);
  return SLUGS.filter(slug=>{const plant=cw.eval('PLANT_LIBRARY.find(x=>x.slug==='+JSON.stringify(slug)+')');return plant&&compiled.matchers.every(fn=>fn(plant));});
 }
 const edible=filtered({q5:'yes-edible'}).sort();
 const flowering=filtered({q6:'yes-flowering'}).sort();
 const expectedEdible=[...EDIBLE_EXPECTED].sort(), expectedFlowering=[...FLOWERING_EXPECTED].sort();
 if(JSON.stringify(edible)!==JSON.stringify(expectedEdible))failures.push({code:'EDIBLE_FILTER_MISMATCH',edible,expectedEdible});
 if(JSON.stringify(flowering)!==JSON.stringify(expectedFlowering))failures.push({code:'FLOWERING_FILTER_MISMATCH',flowering,expectedFlowering});
 await cw.setAppLocation({label:'Tel Aviv, Israel',resolvedCity:'Tel Aviv',lat:32.0853,lon:34.7818,source:'manual'},{skipServerPersist:true});
 await waitFor(()=>cw.getAppClimateProfile()?.structuralClimateStatus==='known',15000);
 for(const slug of ['basil','rosemary']){
  const r=cw.eval('(()=>{smartRecSession.answers={q5:"yes-edible"};const p=PLANT_LIBRARY.find(x=>x.slug==='+JSON.stringify(slug)+');const s=smartRecEvaluateSuitability(p);return {slug:'+JSON.stringify(slug)+',level:s.recommendationLevel,eligible:s.positiveRecommendationEligible!==false,warnings:s.warnings||[]}})()');
  rows.push({context:'edible',...r});
  if(r.warnings.some(w=>/structured fruiting-climate|fruiting climate is not reliable/i.test(w)))failures.push({code:'LEAF_HERB_WRONGLY_REQUIRES_FRUITING_CLIMATE',result:r});
 }
 for(const slug of FLOWERING_EXPECTED){
  const r=cw.eval('(()=>{smartRecSession.answers={q6:"yes-flowering"};const p=PLANT_LIBRARY.find(x=>x.slug==='+JSON.stringify(slug)+');const s=smartRecEvaluateSuitability(p);return {slug:'+JSON.stringify(slug)+',level:s.recommendationLevel,eligible:s.positiveRecommendationEligible!==false,warnings:s.warnings||[]}})()');
  rows.push({context:'flowering',...r});
  if(r.warnings.some(w=>/fruiting climate/i.test(w)))failures.push({code:'ORNAMENTAL_FLOWERING_WRONGLY_PENALIZED_FOR_FRUITING',result:r});
 }
 const summary={contract:'cruvit-unknown-valid-purpose-runtime-v1',plantCount:SLUGS.length,edible,flowering,rowCount:rows.length,failureCount:failures.length,failures,rows};
 window.CruvitUnknownValidPurposeRuntimeV1=summary;
 document.getElementById('out').textContent=JSON.stringify(summary,null,2);
 const st=document.getElementById('status');st.textContent=failures.length?'FAIL '+failures.length:'PASS';st.className=failures.length?'fail':'pass';
})().catch(err=>{document.getElementById('status').textContent='HARNESS ERROR';document.getElementById('status').className='fail';document.getElementById('out').textContent=String(err?.stack||err);console.error(err)});
</script>
