<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 594 1000" role="img" aria-labelledby="t d">
  <title id="t">Plant Identification</title>
  <desc id="d">Identify a plant from a photo and explore care information and similar plants.</desc>
  <defs>
