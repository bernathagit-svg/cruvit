    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset=".48" stop-color="#8c9c72" stop-opacity=".13"/><stop offset="1" stop-color="#31422d" stop-opacity=".36"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#84a45f"/><stop offset=".52" stop-color="#476f42"/><stop offset="1" stop-color="#1f4e32"/></linearGradient>
    <linearGradient id="leafHi" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e2d28c"/><stop offset=".55" stop-color="#d5c375"/><stop offset="1" stop-color="#fff1a6"/></linearGradient>
