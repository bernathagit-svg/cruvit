<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#22351f">
  <title>CRUVIT · Approved Home</title>
  <link rel="stylesheet" href="./styles.css?v=12">
</head>
<body>
  <main class="stage">
    <section class="approved-home" id="home">
      <img id="baseScreen" class="base-screen" src="./assets/home-approved-reference.png" alt="CRUVIT approved Home">

      <div id="carouselStage" class="carousel-stage" aria-hidden="true">
        <div class="clean-bg"><img src="/homepage-v1/assets/hero-garden.jpg" alt=""></div>
        <div class="shade"></div>

        <div id="cardDesign" class="card card-design">
          <img class="variant v0" src="./assets/card-garden-design.png" alt="">
          <img class="variant v1" src="./assets/card-garden-design-center.png" alt="">
        </div>

        <div id="cardGarden" class="card card-garden">
          <img class="variant v0" src="./assets/card-my-garden.png" alt="">
          <img class="variant v1" src="./assets/card-my-garden-side.png" alt="">
        </div>

        <div id="cardDoctor" class="card card-doctor">
          <img class="variant v0" src="./assets/card-plant-doctor-rectified.png" alt="Plant Doctor">
        </div>

        <div id="cardPlantId" class="card card-plant-id">
          <div style="position:absolute;inset:0;overflow:hidden;border-radius:13%;border:1px solid rgba(255,255,255,.72);background:radial-gradient(circle at 50% 58%,rgba(255,244,179,.18),transparent 34%),linear-gradient(180deg,rgba(255,255,255,.18),rgba(60,82,42,.26)),rgba(68,88,49,.58);box-shadow:inset 0 1px 0 rgba(255,255,255,.52),0 16px 30px rgba(20,30,20,.18);backdrop-filter:blur(10px);">
            <div style="position:absolute;inset:0;text-align:center;color:#fff;font-family:Georgia,'Times New Roman',serif;">
              <div style="position:absolute;top:7%;left:7%;right:7%;font-size:8.5%;line-height:1.04;text-shadow:0 2px 8px rgba(0,0,0,.32);">Plant Identification</div>
              <div style="position:absolute;top:24%;left:8%;right:8%;font-family:Arial,sans-serif;font-size:4.45%;line-height:1.28;text-shadow:0 1px 6px rgba(0,0,0,.3);">Take a photo and let CRUVIT identify the plant in seconds.</div>

              <div style="position:absolute;left:15%;right:15%;top:37%;height:34%;">
                <div style="position:absolute;inset:0;border-radius:18%;overflow:hidden;border:1.5px solid rgba(255,255,255,.72);box-shadow:0 10px 22px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.22);">
                  <img src="/homepage-v1/assets/hero-garden.jpg" alt="Plant ready to identify" style="width:100%;height:100%;object-fit:cover;object-position:54% 58%;filter:saturate(.94) brightness(.94);">
                  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,26,15,.02),rgba(14,26,15,.18));"></div>
                  <span style="position:absolute;left:8%;top:9%;width:18%;height:18%;border-left:2px solid rgba(255,242,173,.94);border-top:2px solid rgba(255,242,173,.94);border-radius:8% 0 0 0;"></span>
                  <span style="position:absolute;right:8%;top:9%;width:18%;height:18%;border-right:2px solid rgba(255,242,173,.94);border-top:2px solid rgba(255,242,173,.94);border-radius:0 8% 0 0;"></span>
                  <span style="position:absolute;left:8%;bottom:9%;width:18%;height:18%;border-left:2px solid rgba(255,242,173,.94);border-bottom:2px solid rgba(255,242,173,.94);border-radius:0 0 0 8%;"></span>
                  <span style="position:absolute;right:8%;bottom:9%;width:18%;height:18%;border-right:2px solid rgba(255,242,173,.94);border-bottom:2px solid rgba(255,242,173,.94);border-radius:0 0 8% 0;"></span>
                </div>
                <div style="position:absolute;left:10%;right:10%;bottom:-7%;padding:3.1% 4%;border:1px solid rgba(255,255,255,.52);border-radius:999px;background:rgba(70,88,57,.78);font-family:Arial,sans-serif;font-size:3.15%;line-height:1;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.14);backdrop-filter:blur(6px);">Photo → plant match → care profile</div>
              </div>

              <div style="position:absolute;left:13%;right:13%;bottom:5%;padding:4.2% 5%;border-radius:999px;background:rgba(248,246,238,.94);color:#243b24;font-family:Arial,sans-serif;font-size:4.25%;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.1);">Identify a plant</div>
            </div>
          </div>
        </div>

        <div id="cardSmart" class="card card-smart">
          <img class="variant v0" src="./assets/card-smart-approved-exact.webp" alt="Smart Recommendations">
        </div>

        <div id="cardShop" class="card card-shop">
          <img class="variant v0" src="./assets/card-shop-approved-hq.webp" alt="Shop">
        </div>
      </div>

      <div id="dragSurface" class="drag-surface" aria-label="Swipe modules"></div>
    </section>
  </main>
  <script src="./app.js?v=16"></script>
</body>
</html>
