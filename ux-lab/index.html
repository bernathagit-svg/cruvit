<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#22351f">
  <title>CRUVIT · Approved Home</title>
  <link rel="stylesheet" href="./styles.css?v=9">
</head>
<body>
  <main class="stage">
    <section class="approved-home" id="home">
      <img id="baseScreen" class="base-screen" src="./assets/home-approved-reference.png" alt="CRUVIT approved Home">

      <div id="carouselStage" class="carousel-stage" aria-hidden="true">
        <div class="clean-bg"><img src="/homepage-v1/assets/hero-garden.jpg" alt=""></div>
        <div class="shade"></div>

        <div id="cardDesign" class="card card-design">
          <img class="variant v0" src="./assets/card-garden-design.png" alt="">
          <img class="variant v1" src="./assets/card-garden-design-center.png" alt="">
        </div>

        <div id="cardGarden" class="card card-garden">
          <img class="variant v0" src="./assets/card-my-garden.png" alt="">
          <img class="variant v1" src="./assets/card-my-garden-side.png" alt="">
        </div>

        <div id="cardDoctor" class="card card-doctor">
          <img class="variant v0" src="./assets/card-plant-doctor.png" alt="Plant Doctor">
        </div>

        <div id="cardPlantId" class="card card-plant-id">
          <img class="variant v0" src="./assets/card-plant-id-approved.png" alt="Plant Identification">
          <img class="variant v1" src="./assets/card-plant-id-approved.png" alt="">
        </div>

        <div id="cardSmart" class="card card-smart">
          <div class="smart-approved-card" aria-label="Smart Recommendations">
            <div class="smart-approved-content">
              <div class="smart-approved-title">Smart<br>Recommendations</div>
              <div class="smart-approved-copy">4 plants fit your<br>garden now</div>
              <img class="smart-approved-plant" src="/modules/garden-design/assets/plants/quality-family-calibration-final-1/lavender__mature__shrub__flowering__detail-v2__medium.png" alt="">
              <div class="smart-approved-thumbs" aria-hidden="true">
                <span>🌿</span><span>🌱</span><span>🌸</span>
              </div>
              <div class="smart-approved-cta">See Suggestions →</div>
            </div>
          </div>
        </div>
      </div>

      <div id="dragSurface" class="drag-surface" aria-label="Swipe modules"></div>
    </section>
  </main>
  <script src="./app.js?v=9"></script>
</body>
</html>
