<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#233423">
  <title>CRUVIT · Locked Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="home-shell" aria-label="CRUVIT Home">
    <section class="home-screen">
      <img class="home-bg" src="/homepage-v1/assets/hero-garden.jpg" alt="">
      <div class="home-overlay"></div>

      <header class="home-header">
        <div class="brand-row">
          <span class="leaf-mark">♥</span>
          <span class="brand-name">CRUVIT</span>
        </div>
        <div class="header-actions">
          <button class="round-btn" aria-label="Language">◎</button>
          <button class="round-btn" aria-label="Profile">○</button>
          <button class="premium-btn" aria-label="Premium"><span>♛</span> Premium</button>
        </div>
      </header>

      <section class="hero-copy">
        <div class="eyebrow">ONE UNIFIED ADAPTIVE GARDEN INTELLIGENCE SYSTEM</div>
        <h1>Your garden is unique.<br>Your intelligence should be too.</h1>
        <p>Plan · Identify · Solve · Grow · Shop · All in one place</p>
      </section>

      <section class="carousel-wrap" aria-label="CRUVIT modules">
        <div class="carousel" id="carousel"></div>
        <div class="dots" id="dots"></div>
      </section>

      <nav class="bottom-nav" aria-label="Primary">
        <button class="nav-item active"><span class="nav-icon">⌂</span><span>Home</span></button>
        <button class="nav-item"><span class="nav-icon">♧</span><span>My Garden</span></button>
        <button class="nav-add" aria-label="Add">＋</button>
        <button class="nav-item"><span class="nav-icon">♢</span><span>Notifications</span><i class="notify-dot"></i></button>
        <button class="nav-item"><span class="nav-icon">☰</span><span>More</span></button>
      </nav>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
