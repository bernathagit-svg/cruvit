[build]
  publish = "."
  command = "node tools/deployment/prune-netlify-static-deploy.mjs --netlify-deploy-prune"

[functions]
  directory = "netlify/functions"

[functions.plant-knowledge]
  timeout = 26

[functions.plant-identify]
  timeout = 45

[functions.claude]
  timeout = 30

[functions.garden-weather]
  timeout = 20

[functions.gd-claude]
  timeout = 60

[functions.gd-stability]
  timeout = 60

[functions.gd-replicate]
  timeout = 60

[functions.gd-replicate-inpaint]
  timeout = 60

[functions.gd-openai-image]
  timeout = 60

[functions.pd-claude]
  timeout = 30

[functions.wtp-premium-v1]
  timeout = 10

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Cache-Control, Authorization, X-WTP-Internal"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Max-Age = "86400"

[[headers]]
  for = "/wtp-premium-v1/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# My Garden OS app entry (previous root homepage), kept reachable after Homepage V1 promotion.
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app/"
  to = "/app.html"
  status = 200
