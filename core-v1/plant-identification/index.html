<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRUVIT · Plant Identification · Owner Approved Flow</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef2e7}
body{display:grid;place-items:start center;font-family:Arial,sans-serif;overflow-x:hidden}
.stage{position:relative;width:min(96vw,420px);line-height:0;background:#f7f6ee}
.stage img{display:block;width:100%;height:auto}
.hot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}
.hot:focus-visible{outline:3px solid rgba(30,115,62,.8);outline-offset:-3px}
@media(min-width:600px){
 body{padding:18px 0}
 .stage{box-shadow:0 18px 50px rgba(22,47,27,.14)}
}
</style>
<style id="pi-result-style">
.pi-result{position:absolute;inset:0;container-type:inline-size;pointer-events:none;color:#103c2e;font-family:Arial,sans-serif}
.pi-result-slot{position:absolute;overflow:hidden;display:flex;align-items:center;background:#f7f6ef;font-size:2.65cqw;line-height:1.25}
.pi-result-name{font-size:6.3cqw;line-height:1.04;font-weight:700;overflow-wrap:anywhere;align-items:flex-start}
.pi-result-scientific{font-size:3.15cqw;font-style:italic;align-items:flex-start}
.pi-result-confidence{font-size:2.5cqw}
.pi-result-evidence{font-size:2.25cqw;border:1px solid #d6ddcf;border-radius:3cqw;justify-content:center}
.pi-result-photo{background:#efefe5;justify-content:center;text-align:center}
.pi-result-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pi-result-photo img[hidden],.pi-result-image-message[hidden]{display:none}
.pi-result-image-message{position:relative;z-index:1;padding:1em;background:#efefe5}
.pi-result-credit{position:absolute;bottom:0;left:0;right:0;padding:.6em;background:#f7f6eff2;font-size:max(9px,2.1cqw);line-height:1.2;text-align:left}
.pi-result-credit a{margin-left:.6em;color:inherit;pointer-events:auto}
.pi-result-type,.pi-result-light,.pi-result-water{justify-content:center;text-align:center;font-size:2.1cqw;align-items:flex-start}
.pi-result-description{background:#e6e9df;font-size:2.65cqw;align-items:flex-start;padding:.25em}
.pi-result-careLight,.pi-result-careWater,.pi-result-careSoil,.pi-result-careTemperature{background:#faf9f5;justify-content:center;text-align:center;font-size:2.25cqw;align-items:flex-start;padding:.3em}
.pi-result-similar1,.pi-result-similar2,.pi-result-similar3{background:#e8eadd;border-radius:2.8cqw 2.8cqw 0 0;border:1px solid #cbd3c1;justify-content:center;font-size:2.25cqw}
</style>
<style id="pi-profile-style">
.pi-profile{position:absolute;inset:0;container-type:inline-size;pointer-events:none;font-family:Arial,sans-serif;color:#fff}
.pi-profile-slot{position:absolute;overflow:hidden;line-height:1.25}
.pi-profile-photo{background:#294532;mask-size:100% 100%;mask-repeat:no-repeat}
.pi-profile-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pi-profile-photo:after{content:"";position:absolute;inset:32% 0 44%;background:linear-gradient(transparent,rgba(15,34,19,.6));pointer-events:none}
.pi-profile-photo img[hidden],.pi-profile-image-message[hidden]{display:none}
.pi-profile-image-message{position:absolute;top:25%;left:8%;right:8%;padding:1em;text-align:center;background:#294532;font-size:3cqw}
.pi-profile-name{font-size:5.75cqw;font-weight:600;text-shadow:0 1px 3px #183921}
.pi-profile-scientific{font-size:4.55cqw;text-shadow:0 1px 3px #183921}
.pi-profile-description{background:#faf9f2;color:#2b4330;font-size:3.83cqw;line-height:1.3;padding:.1em}
.pi-profile-credit{background:#f7f6eff2;color:#294532;font-size:max(9px,2.1cqw);line-height:1.2;padding:.3em}
.pi-profile-credit a{margin-left:.6em;color:inherit;pointer-events:auto}
</style>
<style id="pi-care-style">
.pi-care{position:absolute;inset:0;container-type:inline-size;pointer-events:none;font-family:Arial,sans-serif;color:#092d32}
.pi-care-slot{position:absolute;overflow:hidden;line-height:1.18;background:#fdfdf9;font-size:2.12cqw}
.pi-care-name{font-size:4.15cqw;line-height:1;font-weight:700}
.pi-care-scientific{font-size:2.7cqw}
.pi-care-confidence{background:#eaf5e8;color:#174c32;font-size:1.9cqw;line-height:1.05;display:flex;align-items:center}
.pi-care-growth,.pi-care-environment,.pi-care-foliage,.pi-care-air,.pi-care-ease{background:#e9f3e6;border-radius:2cqw;display:flex;align-items:center;justify-content:center;text-align:center;color:#174c32;font-size:2cqw;padding:.25em}
.pi-care-description{color:#285586;font-size:2.28cqw;line-height:1.28}
.pi-care-slot[data-pi-care-slot$="Value"],.pi-care-slot[data-pi-care-slot$="Note"]{color:#285586;background:#fbfcf7}
.pi-care-slot[data-pi-care-slot$="Bar"]{background:repeating-linear-gradient(90deg,#e1e4e4 0,#e1e4e4 13.6%,#fbfcf7 13.6%,#fbfcf7 14.2857%);border-top:2px solid #fbfcf7;border-bottom:2px solid #fbfcf7;border-radius:.5cqw}
.pi-care-photo{border-radius:2.2cqw;background:#efefe5;display:flex;align-items:center;justify-content:center;text-align:center}
.pi-care-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pi-care-photo img[hidden],.pi-care-image-message[hidden]{display:none}
.pi-care-image-message{position:relative;padding:1em;background:#efefe5}
.pi-care-credit{position:absolute;bottom:0;left:0;right:0;background:#f7f6eff2;color:#294532;font-size:max(9px,2.1cqw);line-height:1.2;padding:.35em;text-align:left}
.pi-care-credit a{margin-left:.6em;color:inherit;pointer-events:auto}
</style>
<style id="pi-suitability-style">
.pi-suitability{position:absolute;inset:0;container-type:inline-size;pointer-events:none;font-family:Arial,sans-serif;color:#092d32}
.pi-suitability-slot{position:absolute;overflow:hidden;line-height:1.2;background:#fdfdf9;font-size:2.15cqw}
.pi-suitability-name{font-size:4.1cqw;font-weight:700;line-height:1}
.pi-suitability-scientific{font-size:2.85cqw}
.pi-suitability-growth,.pi-suitability-environment,.pi-suitability-foliage,.pi-suitability-ease{background:#eaf3e6;border-radius:2cqw;display:flex;align-items:center;justify-content:center;text-align:center;color:#174c32;font-size:2cqw;padding:.2em}
.pi-suitability-description{font-size:2.6cqw;color:#285586;background:#f5f7ee}
.pi-suitability-slot[data-pi-suitability-slot$="Value"],.pi-suitability-slot[data-pi-suitability-slot$="Note"]{color:#285586;background:#fbfcf7}
.pi-suitability-slot[data-pi-suitability-slot$="Bar"]{background:repeating-linear-gradient(90deg,#e1e4e4 0,#e1e4e4 13.6%,#fbfcf7 13.6%,#fbfcf7 14.2857%);border-top:2px solid #fbfcf7;border-bottom:2px solid #fbfcf7;border-radius:.5cqw}
.pi-suitability-location,.pi-suitability-score,.pi-suitability-evidence{background:#ecf7e7;color:#285586;font-size:1.95cqw}
.pi-suitability-verdict{background:#ecf7e7;color:#365d4c;font-size:2.4cqw;font-weight:700;display:flex;align-items:center}
.pi-suitability-evidence{background:#eaf5e3;overflow:auto;pointer-events:auto;white-space:pre-line;font-size:1.95cqw;line-height:1.25}
.pi-suitability-photo{border-radius:2.5cqw;background:#efefe5;display:flex;align-items:center;justify-content:center;text-align:center}
.pi-suitability-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pi-suitability-photo img[hidden],.pi-suitability-image-message[hidden]{display:none}
.pi-suitability-image-message{position:relative;padding:.5em;background:#efefe5;font-size:2cqw}
.pi-suitability-credit{position:absolute;bottom:0;left:0;right:0;max-height:36%;overflow:auto;pointer-events:auto;background:#f7f6eff2;font-size:max(8px,1.8cqw);line-height:1.1;padding:.25em;text-align:left}
.pi-suitability-credit a{margin-left:.4em;color:inherit}
</style>
</head>

<script type="module">
import {wireRealPiInputs,createPiResultView,createPiProfileView,canonicalPiProfile,createPiCareView} from '../../modules/plant-identifier/real-pi-runtime-v1.js';
import {createPiSuitabilityView} from '../../modules/plant-identifier/pi-suitability-view-v1.js';
const screens=Array.from({length:8},(_,i)=>(window.__PI?.[i]||[]).join(""));
const expected=[2310742,3406426,1786662,3352146,3347862,2456618,2020150,2405466];
if(screens.some((s,i)=>s.length!==expected[i])) throw new Error("Approved asset integrity check failed");
const titles=["Identify","Camera","Analyzing","Result","Plant Profile","Care","Suitability","Save to My Garden"];
const hotspots={
0:[{x:10,y:50,w:80,h:13,action:"camera",label:"Take a photo"},{x:10,y:63,w:80,h:7,action:"gallery",label:"Choose from gallery"}],
1:[{x:30,y:66,w:40,h:20,action:"capture",label:"Capture photo"},{x:10,y:71,w:15,h:9,action:"gallery",label:"Choose from gallery"},{x:7,y:5,w:11,h:7,action:"back",label:"Back"}],
2:[],
3:[{x:5,y:55,w:90,h:27,to:4,label:"View full profile"}],
4:[{x:18,y:28,w:20,h:9,to:5,label:"Care"}],
5:[{x:5,y:5,w:90,h:84,to:6,label:"Continue to suitability"}],
6:[{x:5,y:80,w:90,h:13,to:7,label:"Save to My Garden"}],
7:[{x:10,y:78,w:80,h:5,to:0,label:"Save to My Garden"}]
};
let index=0,saveAction=null,saving=false,acquisition=null,shownResultActionId=null,profileState=null,careState=null,suitabilityState=null;
const stage=document.getElementById("stage"),img=document.getElementById("screen");
const resultView=createPiResultView({document,stage,onReady:()=>render()});
const profileView=createPiProfileView({document,stage,onReady:()=>render()});
const careView=createPiCareView({document,stage});
const suitabilityView=createPiSuitabilityView({document,stage,window,
 readState:()=>acquisition?.getState(),getClient:()=>window.cruvitCorePiSuitability});
stage.addEventListener('cruvit-pi-save-bind',event=>{if(typeof event.detail?.save==='function')saveAction=event.detail.save;});
// Manual navigation stays within acquisition. Only qualified controller state opens PI-04.
function go(i){if(saving||i>index)return;index=Math.max(0,Math.min(2,i));render()}
function showAcquisitionScreen(i){index=Math.max(0,Math.min(2,i));render()}
function render(){
 const state=acquisition?.getState();
 const resultReady=state?.status==='CANONICAL_READY'&&state.readyForResult===true;
 if(resultReady&&state.actionId&&state.actionId!==shownResultActionId){
  shownResultActionId=state.actionId;index=3;
 }else if(index===3&&!resultReady){index=1;}
 // Each permit is the current immutable controller state, captured only by its
 // preceding bound button. URL/DOM fields and numeric navigation are not permits.
 if(!Number.isInteger(index)||index>=4&&(![4,5,6].includes(index)||profileState!==state
   ||!canonicalPiProfile(state).available||index>=5&&careState!==state
   ||index===6&&(suitabilityState!==state||!suitabilityView.isCurrent(state)))){
  profileState=null;careState=null;suitabilityState=null;index=1;
 }
 if(![4,5,6].includes(index))profileState=null;
 if(index!==5&&index!==6)careState=null;
 if(index!==6)suitabilityState=null;
 stage.querySelectorAll(".hot").forEach(x=>x.remove());
 img.src=screens[index];
 img.alt="CRUVIT Plant Identification — "+titles[index];
 document.title="CRUVIT · Plant Identification · "+titles[index];
 resultView.update(state,index===3&&resultReady);
 profileView.update(state,index===4&&profileState===state);
 careView.update(state,index===5&&careState===state);
 suitabilityView.update(state,index===6&&suitabilityState===state);
 img.setAttribute('aria-hidden',String(index>=3&&index<=6));
 // Only the approved Care tile in a successfully bound profile opens PI-06.
 // PI-07 requires its own current Care permit; PI-08/save remain closed.
 const activeHotspots=index<3?hotspots[index]||[]:index===3&&resultView.isReady(state)
  ?[{...hotspots[3][0],x:72,y:51.6,w:21,h:4}]
  :index===4?[{x:6.2,y:5.3,w:11.1,h:6.2,label:"Back to result"},
   ...(profileView.isReady(state)?[{x:6.4,y:57.5,w:20.5,h:13.5,label:"Care",to:5}]:[])]
  :index===5?[{x:9.5,y:1.5,w:16,h:3,label:"Back to profile"},
   {x:39.5,y:30.4,w:23,h:5.1,label:"Growing Conditions",to:6}]
  :index===6?[{x:9.5,y:1.5,w:16,h:3,label:"Back to care"}]:[];
 for(const h of activeHotspots){
  const b=document.createElement("button");
  b.className="hot";b.type="button";b.setAttribute("aria-label",h.label);
  b.style.left=h.x+"%";b.style.top=h.y+"%";b.style.width=h.w+"%";b.style.height=h.h+"%";
  if(h.action){b.setAttribute('data-pi-action',h.action);b.disabled=h.action!=='back'&&['IMAGE_LOADING','IDENTIFYING'].includes(acquisition?.getState().status);}
  if(index===3)b.setAttribute('data-pi-profile-open','');
  if(index===4&&h.to===5)b.setAttribute('data-pi-care-open','');
  if(index===5&&h.to===6)b.setAttribute('data-pi-suitability-open','');
  b.onclick=async e=>{e.stopPropagation();
   if(index>=3&&!Array.from(stage.querySelectorAll('.hot')).includes(b))return;
   if(index===3){
    if(e.isTrusted===true&&h.to===4&&acquisition.getState()===state&&resultView.isReady(state)){
     profileState=state;index=4;render();
    }return;
   }
   if(index===4){
    if(e.isTrusted===true&&profileState===state&&acquisition.getState()===state){
     if(h.label==='Back to result'){index=3;render();}
     else if(h.to===5&&profileView.isReady(state)){careState=state;index=5;render();}
    }
    return;
   }
   if(index===5){
    if(e.isTrusted===true&&profileState===state&&careState===state&&acquisition.getState()===state){
     if(h.label==='Back to profile'){index=4;render();}
     else if(h.to===6&&suitabilityView.start(state)){suitabilityState=state;index=6;render();}
    }
    return;
   }
   if(index===6){
    if(e.isTrusted===true&&h.label==='Back to care'&&suitabilityState===state
      &&acquisition.getState()===state){index=5;render();}
    return;
   }
   if(h.action){acquisition?.activate(h.action);return;}if(index!==7){go(h.to);return;}if(saving)return;
   if(!saveAction){alert('Preview save is not ready. No data was saved.');return;}
   saving=true;b.disabled=true;stage.setAttribute('aria-busy','true');
   try{await saveAction();location.assign('/core-v1/my-garden/');}
   catch(error){alert('Save not completed: '+error.message+' No second save was attempted automatically.');}
   finally{saving=false;b.disabled=false;stage.removeAttribute('aria-busy');}
  };stage.appendChild(b);
 }
}
let touchStartX=null;
stage.addEventListener("touchstart",e=>{touchStartX=e.changedTouches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{
 if(touchStartX===null)return;
 const dx=e.changedTouches[0].clientX-touchStartX;touchStartX=null;
 if(dx>40&&index>0)go(index-1);
},{passive:true});
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")go(index-1);
});
acquisition=wireRealPiInputs({document,stage,showScreen:showAcquisitionScreen,render});
Object.defineProperty(window,'__CRUVIT_REAL_PI_STATE',{get:acquisition.getState});
render();
</script>
<script src="../my-garden/assets/supabase.js"></script>
<script type="module" src="./atomic/boot.mjs"></script>
<script type="module" id="core-pi-suitability-client">
import {createPiSuitabilityClient} from '../../modules/plant-identifier/suitability-context-handoff-v1.js';
import {canonicalPiResult} from '../../modules/plant-identifier/real-pi-runtime-v1.js';
// No automatic evaluation or screen change. PI-07/08 remain closed.
Object.defineProperty(window, 'cruvitCorePiSuitability', {value: createPiSuitabilityClient({window,
  readCanonicalResult() {
    const state = window.__CRUVIT_REAL_PI_STATE, result = canonicalPiResult(state);
    return result.available ? {state, actionId: state.actionId,
      canonicalSlug: result.canonicalSlug, scientific: result.scientific} : null;
  }
})});
</script>
