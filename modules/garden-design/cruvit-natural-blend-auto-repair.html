<!doctype html>
<meta charset="utf-8">
<title>CRUVIT · Natural Blend Auto Repair</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#0d1210;color:#eef5ef;padding:24px}
h1{margin:0 0 8px}.muted{color:#a9b7ad}.ok{color:#7fe0a6}.bad{color:#ff9a9a}
pre{white-space:pre-wrap;background:#141b17;padding:14px;border-radius:12px;max-width:1100px}
</style>
<h1>CRUVIT · Natural Blend Auto Repair</h1>
<p class="muted">Scene-specific bounded repairs only. No Production or Registry writes.</p>
<pre id="log">starting…</pre>
<script>
const log=document.getElementById('log');
const params=new URLSearchParams(location.search);
const runs=String(params.get('runs')||'').split(',').map(s=>s.trim()).filter(Boolean);
const SAFE=/^[A-Za-z0-9][A-Za-z0-9._-]{7,180}$/;

function write(msg){log.textContent+=('\n'+msg);}
function clamp(n,min,max){return Math.min(max,Math.max(min,n));}
function data64(canvas,type='image/png',q){const s=canvas.toDataURL(type,q);return s.slice(s.indexOf(',')+1);}
function roundedRectPath(ctx,x,y,w,h,radius){
  const r=Math.min(radius,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function loadImageBlob(blob){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(blob);const img=new Image();img.onload=()=>resolve({img,url:u});img.onerror=()=>reject(new Error('IMAGE_DECODE_FAILED'));img.src=u;});}
function loadDataImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('EDIT_DECODE_FAILED'));img.src=src;});}

async function buildInput(plan){
  const captureRun=plan?.sourceCapture?.runId;
  const jobId=plan?.sourceJobId;
  if(!SAFE.test(captureRun||'')||!SAFE.test(jobId||''))throw new Error('SOURCE_CAPTURE_IDS_INVALID');

  const statusRes=await fetch('/.netlify/functions/plant-visual-in-garden-capture-status?runId='+encodeURIComponent(captureRun)+'&t='+Date.now(),{cache:'no-store'});
  if(!statusRes.ok)throw new Error('CAPTURE_STATUS_'+statusRes.status);
  const status=await statusRes.json();
  const row=(status.rows||[]).find(x=>x.jobId===jobId);
  if(!row||row.status!=='CAPTURED'||!row.geometry?.cutout)throw new Error('CAPTURE_ROW_INVALID');

  const imgRes=await fetch('/.netlify/functions/plant-visual-in-garden-current-capture-image?runId='+encodeURIComponent(captureRun)+'&jobId='+encodeURIComponent(jobId)+'&t='+Date.now(),{cache:'no-store'});
  if(!imgRes.ok)throw new Error('CAPTURE_IMAGE_'+imgRes.status);
  const loaded=await loadImageBlob(await imgRes.blob());
  const fullImg=loaded.img;
  const frameW=fullImg.naturalWidth||fullImg.width;
  const frameH=fullImg.naturalHeight||fullImg.height;
  const cut=row.geometry.cutout;
  const compositeProfile=String(plan?.inputContract?.compositeProfile||'DEFAULT');
  const boundaryMode=String(plan?.inputContract?.finalCompositeBoundaryMode||'HARD_ROUNDED_RECT_V1');
  const lowPlant=compositeProfile==='LOW_PLANT_TIGHT_FEATHER_V1';

  const cx=Number(cut.x)+Number(cut.width)/2;
  const cy=Number(cut.y)+Number(cut.height)*0.54;
  const desired=Math.max(Number(cut.width)*1.65,Number(cut.height)*1.34,Math.min(frameW,frameH)*0.34);
  const side=Math.max(64,Math.min(desired,frameW,frameH));
  let cropX=cx-side/2;
  let cropY=cy-side/2+Number(cut.height)*0.06;
  cropX=clamp(cropX,0,Math.max(0,frameW-side));
  cropY=clamp(cropY,0,Math.max(0,frameH-side));

  const out=1024;
  const cropCanvas=document.createElement('canvas');cropCanvas.width=out;cropCanvas.height=out;
  const cctx=cropCanvas.getContext('2d');if(!cctx)throw new Error('CROP_CTX');
  cctx.drawImage(fullImg,cropX,cropY,side,side,0,0,out,out);

  const sx=out/side;
  const bx=(Number(cut.x)-cropX)*sx,by=(Number(cut.y)-cropY)*sx;
  const bw=Number(cut.width)*sx,bh=Number(cut.height)*sx;
  const expandX=Math.max(lowPlant?10:18,bw*(lowPlant?0.05:0.12));
  const expandTop=Math.max(lowPlant?8:14,bh*(lowPlant?0.03:0.07));
  const expandBottom=Math.max(lowPlant?18:28,bh*(lowPlant?0.10:0.16));
  const editX=clamp(bx-expandX,0,out),editY=clamp(by-expandTop,0,out);
  const editW=clamp(bw+expandX*2,1,out-editX),editH=clamp(bh+expandTop+expandBottom,1,out-editY);

  const mask=document.createElement('canvas');mask.width=out;mask.height=out;
  const mctx=mask.getContext('2d');if(!mctx)throw new Error('MASK_CTX');
  mctx.fillStyle='rgba(255,255,255,1)';mctx.fillRect(0,0,out,out);mctx.globalCompositeOperation='destination-out';
  roundedRectPath(mctx,editX,editY,editW,editH,Math.max(24,editW*0.08));mctx.fill();
  mctx.beginPath();mctx.ellipse(bx+bw/2,Math.min(out-2,by+bh*0.98),Math.max(24,bw*0.48),Math.max(12,bh*0.10),0,0,Math.PI*2);mctx.fill();
  mctx.globalCompositeOperation='source-over';

  const alpha=document.createElement('canvas');alpha.width=out;alpha.height=out;
  const actx=alpha.getContext('2d');if(!actx)throw new Error('ALPHA_CTX');
  if(boundaryMode==='FEATHERED_EDIT_REGION_V1'){
    const shape=document.createElement('canvas');shape.width=out;shape.height=out;
    const sctx=shape.getContext('2d');if(!sctx)throw new Error('ALPHA_SHAPE_CTX');
    sctx.fillStyle='#fff';roundedRectPath(sctx,editX,editY,editW,editH,Math.max(18,editW*0.07));sctx.fill();
    sctx.beginPath();sctx.ellipse(bx+bw/2,Math.min(out-2,by+bh*0.98),Math.max(18,bw*0.44),Math.max(10,bh*0.09),0,0,Math.PI*2);sctx.fill();
    const featherPx=Math.max(12,Math.min(30,Math.min(editW,editH)*0.045));
    actx.filter='blur('+featherPx+'px)';
    actx.drawImage(shape,0,0);
    actx.filter='none';
  }else{
    actx.fillStyle='#fff';roundedRectPath(actx,editX,editY,editW,editH,Math.max(24,editW*0.08));actx.fill();
    actx.beginPath();actx.ellipse(bx+bw/2,Math.min(out-2,by+bh*0.98),Math.max(24,bw*0.48),Math.max(12,bh*0.10),0,0,Math.PI*2);actx.fill();
  }

  return {cropBase64:data64(cropCanvas),maskBase64:data64(mask),alpha,fullImg,frameW,frameH,cropRect:{x:cropX,y:cropY,side},outputSize:out,blobUrl:loaded.url,boundaryMode,compositeProfile};
}

async function hardComposite(input,editedBase64){
  const edited=await loadDataImage('data:image/png;base64,'+editedBase64);
  const patch=document.createElement('canvas');patch.width=input.outputSize;patch.height=input.outputSize;
  const pctx=patch.getContext('2d');pctx.drawImage(edited,0,0,input.outputSize,input.outputSize);
  pctx.globalCompositeOperation='destination-in';pctx.drawImage(input.alpha,0,0);pctx.globalCompositeOperation='source-over';
  const full=document.createElement('canvas');full.width=input.frameW;full.height=input.frameH;
  const fctx=full.getContext('2d');fctx.drawImage(input.fullImg,0,0,input.frameW,input.frameH);
  const r=input.cropRect;fctx.drawImage(patch,r.x,r.y,r.side,r.side);
  return data64(full,'image/jpeg',0.94);
}

async function runOne(runId){
  if(!SAFE.test(runId))throw new Error('RUN_ID_INVALID');
  write('loading '+runId);
  const pr=await fetch('/data/garden-design/plant-visual-natural-blend-plans/'+encodeURIComponent(runId)+'.json?t='+Date.now(),{cache:'no-store'});
  if(!pr.ok)throw new Error('PLAN_'+pr.status);
  const plan=await pr.json();
  const input=await buildInput(plan);
  write('crop+mask ready · '+plan.sourceJobId);

  const br=await fetch('/.netlify/functions/plant-visual-natural-blend-job',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
    runId:plan.runId,jobId:plan.sourceJobId,cropBase64:input.cropBase64,maskBase64:input.maskBase64
  })});
  const bd=await br.json();
  if(!br.ok||!bd?.ok||!bd?.outputBase64)throw new Error(bd?.code||('BLEND_'+br.status));
  write('Natural Blend recorded · '+plan.sourceJobId);

  const compositeBase64=await hardComposite(input,bd.outputBase64);
  const sr=await fetch('/.netlify/functions/plant-visual-natural-blend-composite-store',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
    runId:plan.runId,jobId:plan.sourceJobId,compositeBase64,
    compositeMode:input.boundaryMode,compositeProfile:input.compositeProfile
  })});
  const sd=await sr.json();
  if(!sr.ok||!sd?.ok)throw new Error(sd?.code||('STORE_'+sr.status));
  URL.revokeObjectURL(input.blobUrl);
  write('FINAL_COMPOSITE_RECORDED · '+plan.sourceJobId);
  return {runId,jobId:plan.sourceJobId,ok:true,composite:sd.evidence?.finalCompositeObjectKey||null};
}

(async()=>{
  log.textContent='CRUVIT Natural Blend Auto Repair';
  if(!runs.length){write('NO_RUNS');return;}
  const results=[];
  for(const run of runs){
    try{results.push(await runOne(run));}
    catch(err){results.push({runId:run,ok:false,error:String(err?.message||err)});write('ERROR · '+run+' · '+String(err?.message||err));}
  }
  window.__CRUVIT_REPAIR_RESULTS__=results;
  write('DONE '+JSON.stringify(results));
  document.body.dataset.done='true';
})().catch(err=>{write('FATAL '+String(err?.message||err));document.body.dataset.done='true';});
</script>
