<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CRUVIT Plant Visual Approved Promotion</title>
  <style>
    body{font-family:Inter,system-ui,sans-serif;margin:0;padding:24px;background:#f5f7f4;color:#183024}
    .card{max-width:820px;margin:0 auto;background:#fff;border:1px solid #d8e0da;border-radius:16px;padding:18px}
    button{padding:10px 14px;border-radius:10px;border:1px solid #24583d;background:#24583d;color:#fff;cursor:pointer}
    pre{white-space:pre-wrap;word-break:break-word;background:#f1f4f1;padding:12px;border-radius:10px}
    .warn{background:#fff4e7;padding:10px 12px;border-radius:10px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Approved Plant Visual Promotion</h1>
    <p class="warn">This surface only triggers a server-side manifest promotion that already has an exact owner approval artifact. No image generation or paid AI calls occur here.</p>
    <p>Manifest: <strong id="manifestLabel"></strong></p>
    <button id="run" type="button">Execute approved promotion</button>
    <pre id="result">Not executed.</pre>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    const manifest=String(params.get('manifest')||'').trim().toLowerCase();
    const valid=/^[a-z0-9][a-z0-9._-]{0,95}$/.test(manifest);
    document.getElementById('manifestLabel').textContent=valid?manifest:'INVALID';
    const btn=document.getElementById('run');
    if(!valid) btn.disabled=true;
    btn.addEventListener('click',async()=>{
      btn.disabled=true;
      const out=document.getElementById('result');
      out.textContent='Running…';
      try{
        const res=await fetch('/.netlify/functions/plant-visual-promote-manifest',{
          method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({manifestId:manifest})
        });
        const body=await res.json();
        out.textContent=JSON.stringify({httpStatus:res.status,...body},null,2);
      }catch(err){
        out.textContent=JSON.stringify({ok:false,error:String(err&&err.message||err)},null,2);
      }
    });
  </script>
</body>
</html>
